  const body=`<p class="small" style="margin:0 0 12px;color:var(--text-2)">El PIN no se puede recuperar. Para volver a entrar hay que borrar los datos de la app en este iPhone. Luego puedes restaurar tu última copia de seguridad desde <b>Más → Copia de seguridad</b>.</p><div class="row-btns"><button class="btn-danger" id="fp-wipe">Borrar datos y quitar el PIN</button></div>`;
  const md=openModal({title:"Olvidé mi PIN", body, sheet:false});
  const w=md.el.querySelector("#fp-wipe"); w.onclick=()=>{ if(!w.classList.contains("armed")){w.classList.add("armed");w.textContent="Toca otra vez: se borra todo";return;} try{localStorage.removeItem(KEY);}catch(e){} location.reload(); };
};
let hiddenAt=0;
document.addEventListener("visibilitychange",()=>{ if(document.hidden) hiddenAt=Date.now(); else if(DB.settings.pinHash && hiddenAt && Date.now()-hiddenAt>60000 && $("lock").hidden) showLock(); });

/* ================= Más ================= */
let catTab="gasto", stopArm=null;
function renderMas(){
  const el=$("v-mas"); const R=DB.settings.rates;
  const inUse=[...new Set([main(),...DB.accounts.map(a=>a.currency),"USD","EUR"])].filter(c=>c!==main());
  const recs=activeRecs().sort((a,b)=>a.dia-b.dia);
  el.innerHTML=`<div class="mas-grid">
  <div class="stack">
    <section class="card set-sec"><h3>Pagos y movimientos fijos</h3>
      <p>Se registran solos cada mes. Cambia el valor y aplica desde este mes. Agrega el enlace de pago para usar el botón “Pagar”.</p>
      <ul class="ilist">${recs.length?recs.map(r=>`<li style="grid-template-columns:1fr">
        <div style="display:flex;justify-content:space-between;gap:8px;align-items:center"><div style="min-width:0"><div class="t">${esc(r.nota||r.cat)}${r.tipo==="ingreso"?' <span class="tag" style="color:var(--good);border-color:var(--good);background:transparent">ingreso</span>':r.tipo==="transfer"?' <span class="tag">transferencia</span>':""}</div><div class="s">Día ${r.dia} · ${esc(r.cat)} · ${esc(accById(r.cuenta).name)}</div></div>
          <input class="inp num" data-rv="${r.id}" inputmode="decimal" value="${fmtInput(r.monto,accCur(r.cuenta))}" aria-label="Valor mensual"></div>
        ${r.tipo==="gasto"?`<input class="inp" data-rl="${r.id}" placeholder="Enlace de pago (ej. enel.com.co/pagos)" value="${esc(r.link||"")}" inputmode="url" autocapitalize="off" style="width:100%;text-align:left">`:""}
        <div class="acts" style="justify-content:flex-end">${r.tipo!=="ingreso"?`<button class="link" data-cal="${r.id}">📅 Agregar al calendario</button>`:""}<button class="link bad" data-stop="${r.id}">${stopArm===r.id?"Confirmar":"Dejar de repetir"}</button></div></li>`).join("")
        :`<li class="empty" style="text-align:left;padding:6px 0">Aún no tienes fijos. Activa “Repetir cada mes” al agregar un movimiento.</li>`}</ul></section>

    <section class="card set-sec"><h3>Importar</h3>
      <p>Revisas todo antes de guardar y no se duplica lo que ya importaste.</p>
      <div class="row-btns"><button class="btn" data-imp="wallet">Pagos de Wallet (.txt)</button><button class="btn" data-imp="csv">Extracto del banco (.csv)</button><button class="btn" data-imp="qif">Archivo QIF</button></div></section>

    <section class="card set-sec"><h3>Exportar y copia de seguridad</h3>
      <p>Tus datos viven solo en este iPhone. Guarda una copia en iCloud Drive de vez en cuando; también sirve para pasarlos a otro dispositivo.</p>
      <div class="row-btns"><button class="btn" id="x-csv">Movimientos (.csv)</button><button class="btn" id="x-qif">Movimientos (.qif)</button></div>
      <div class="row-btns"><button class="btn-primary" id="x-bk" style="padding:9px 14px">Guardar copia</button><button class="btn" id="x-rs">Restaurar copia</button></div></section>

    <section class="card set-sec"><h3>Seguridad</h3>
      <p>${DB.settings.pinHash?"La app pide tu PIN al abrirla y después de 1 minuto en segundo plano.":"Protege la app con un PIN de 4 dígitos."} El PIN evita que otros abran la app en tu celular; no reemplaza el código de bloqueo del iPhone.</p>
      <div class="row-btns">${DB.settings.pinHash?`<button class="btn" id="p-chg">Cambiar PIN</button><button class="btn-danger" id="p-off">Quitar PIN</button>`:`<button class="btn-primary" id="p-on" style="padding:9px 14px">Activar PIN</button>`}</div></section>
  </div>
  <div class="stack">
    <section class="card set-sec"><h3>Categorías</h3>
      <div class="filter" style="align-self:flex-start"><button data-ct="gasto" aria-pressed="${catTab==="gasto"}">Gastos</button><button data-ct="ingreso" aria-pressed="${catTab==="ingreso"}">Ingresos</button></div>
      <ul class="ilist" id="cat-list">${DB.cats[catTab].map((c,i)=>{ const prot=c.n===fallbackCat(catTab);
        return `<li><div class="t"><button class="cic sm" data-ci="${i}" style="--c:${colorOf(c.n,catTab)}" aria-label="Cambiar ícono de ${esc(c.n)}">${catIcon(c.n,catTab)}</button><input type="color" data-cc="${i}" value="${toHexColor(colorOf(c.n,catTab))}" aria-label="Color de ${esc(c.n)}"><span>${esc(c.n)}</span></div>
        <div class="acts"><button class="link" data-cr="${i}">Renombrar</button>${prot?"":`<button class="link bad" data-cd="${i}">Borrar</button>`}</div></li>`;}).join("")}</ul>
      <div style="display:flex;gap:8px"><input class="inp" id="cat-new" placeholder="Nueva categoría" maxlength="28"><button class="btn" id="cat-add">Agregar</button></div></section>

    <section class="card set-sec"><h3>Categorización automática</h3>
      <p>Si la nota o el comercio contiene la palabra, se asigna esa categoría al agregar o importar.</p>
      <ul class="ilist">${DB.rules.map((r,i)=>`<li><div><div class="t">“${esc(r.kw)}” → ${esc(r.cat)}</div></div><button class="link bad" data-rd="${i}">Quitar</button></li>`).join("")||`<li class="s" style="grid-template-columns:1fr">Ya reconozco comercios comunes (Éxito, Rappi, Uber, Netflix, Enel…). Agrega los tuyos.</li>`}</ul>
      <div class="fgrid"><input class="inp" id="rule-kw" placeholder="Palabra (ej. Smart Fit)"><select class="inp" id="rule-cat">${catList("gasto").map(c=>`<option>${esc(c)}</option>`).join("")}${catList("ingreso").map(c=>`<option>${esc(c)}</option>`).join("")}</select></div>
      <div class="row-btns"><button class="btn" id="rule-add">Agregar regla</button><button class="btn" id="rule-apply">Aplicar a lo ya registrado</button></div></section>

    <section class="card set-sec"><h3>Moneda y tipos de cambio</h3>
      <div class="field"><label for="cur-main">Moneda principal (para totales y gráficos)</label><select id="cur-main">${CURRENCIES.map(c=>`<option value="${c.code}" ${c.code===main()?"selected":""}>${c.code} · ${c.name}</option>`).join("")}</select></div>
      <p>Cada cuenta tiene su propia moneda; los totales se convierten a la principal con la tasa del día.</p>
      <ul class="ilist">${inUse.map(c=>{ const v=convert(1,c,main()); return `<li><span class="t">1 ${c}</span><span class="num">${rateOf(c)&&rateOf(main())?fmtC(v,main()).replace(/(\d)$/,"$1"):"—"}</span></li>`; }).join("")}</ul>
      <div class="row-btns" style="align-items:center"><button class="btn" id="r-upd">Actualizar tasas</button><span class="small muted">${R&&R.date?`Tasas del ${R.date}`:"Sin tasas descargadas"}</span></div>
      <div class="fgrid"><select class="inp" id="h-cur">${CURRENCIES.filter(c=>c.code!==main()).map(c=>`<option value="${c.code}">${c.code}</option>`).join("")}</select><input class="inp" type="date" id="h-date" max="${todayISO}" value="${shiftMonth(curMonth,-12)}-01"></div>
      <div class="row-btns"><button class="btn" id="h-go">Ver tasa de esa fecha</button><button class="btn" id="h-12">Últimos 12 meses</button></div>
      <div id="h-out" class="small" style="color:var(--text-2)"></div></section>

    <section class="card set-sec"><h3>Colores y visualización</h3><div class="swatches" id="swatches">${themeSwatches()}</div>
      <p>Elige el tipo de gráfico, qué métricas ver arriba y qué secciones mostrar.</p><div class="row-btns"><button class="btn" id="viz-open">🎨 Personalizar gráficos y métricas</button></div></section>

    <section class="card set-sec"><h3>Sincronizar, compartir y bancos</h3>
      <p>Para que tus datos estén en varios dispositivos, se compartan con tu familia o se conecten con el banco se necesita un servidor en internet que guarde tu información. Esta app la guarda solo en tu iPhone, por privacidad. Para pasar tus datos a otro equipo usa <b>Guardar copia</b> y <b>Restaurar copia</b>; para traer movimientos del banco, descarga el extracto en CSV desde su app o portal e impórtalo.</p></section>

    <section class="card set-sec"><h3>Borrar todo</h3><p>Elimina movimientos, cuentas, metas y ajustes de este iPhone. No se puede deshacer.</p>
      <div class="row-btns"><button class="btn-danger" id="wipe">Borrar todos mis datos</button></div></section>
    <p class="small faint">${DB.movs.length} movimientos · ${DB.accounts.length} cuenta(s) · ${activeRecs().length} fijo(s) · ${DB.goals.length} meta(s)</p>
  </div></div>`;
  const q=s=>el.querySelector(s);
  // fijos
  el.querySelectorAll("[data-rv]").forEach(i=>{ const r=DB.recs.find(x=>x.id===i.dataset.rv); i.oninput=()=>liveFormat(i,accCur(r.cuenta)); i.onchange=()=>{ const v=parseMonto(i.value,accCur(r.cuenta)); if(!v){ i.value=fmtInput(r.monto,accCur(r.cuenta)); return; } r.monto=v; applyTemplateFrom(r,curMonth); save(); toast("Valor actualizado desde este mes."); }; });
  el.querySelectorAll("[data-rl]").forEach(i=>i.onchange=()=>{ const r=DB.recs.find(x=>x.id===i.dataset.rl); r.link=normLink(i.value); i.value=r.link; save(); toast(r.link?"Enlace de pago guardado.":"Enlace quitado."); });
  el.querySelectorAll("[data-cal]").forEach(b=>b.onclick=()=>addToCalendar(DB.recs.find(x=>x.id===b.dataset.cal)));
  el.querySelectorAll("[data-stop]").forEach(b=>b.onclick=()=>{ const id=b.dataset.stop; if(stopArm!==id){ stopArm=id; renderMas(); return; } const r=DB.recs.find(x=>x.id===id); if(r) r.hasta=curMonth; stopArm=null; save(); renderMas(); toast("Ya no se agregará desde el próximo mes."); });
  // importar/exportar
  el.querySelectorAll("[data-imp]").forEach(b=>b.onclick=()=>startImport(b.dataset.imp));
  q("#x-csv").onclick=exportCSV; q("#x-qif").onclick=exportQIF; q("#x-bk").onclick=exportBackup;
  q("#x-rs").onclick=()=>pickFile(".json,application/json",t=>restoreBackup(t));
  // PIN
  const on=q("#p-on"), chg=q("#p-chg"), off=q("#p-off");
  if(on) on.onclick=()=>showLock({step:1, done:renderMas});
  if(chg) chg.onclick=()=>showLock({step:1, done:renderMas});
  if(off) off.onclick=()=>{ if(!off.classList.contains("armed")){off.classList.add("armed");off.textContent="Toca otra vez";return;} delete DB.settings.pinHash; delete DB.settings.pinSalt; save(); renderMas(); toast("PIN quitado."); };
  // categorías
  el.querySelectorAll("[data-ct]").forEach(b=>b.onclick=()=>{catTab=b.dataset.ct;renderMas();});
  el.querySelectorAll("[data-cc]").forEach(i=>i.onchange=()=>{ DB.cats[catTab][i.dataset.cc].c=i.value; save(); });
  el.querySelectorAll("[data-ci]").forEach(b=>b.onclick=()=>pickIcon(catTab, Number(b.dataset.ci)));
  el.querySelectorAll("[data-cr]").forEach(b=>b.onclick=()=>renameCat(catTab, Number(b.dataset.cr)));
  el.querySelectorAll("[data-cd]").forEach(b=>b.onclick=()=>{ if(!b.classList.contains("armed")){ b.classList.add("armed"); b.textContent="¿Seguro?"; return; } deleteCat(catTab, Number(b.dataset.cd)); });
  q("#cat-add").onclick=()=>{ const n=q("#cat-new").value.trim(); if(!n) return; if(catList(catTab).some(c=>c.toLowerCase()===n.toLowerCase())) return toast("Esa categoría ya existe."); DB.cats[catTab].splice(DB.cats[catTab].length-1,0,{n}); save(); renderMas(); toast("Categoría agregada."); };
  // reglas
  el.querySelectorAll("[data-rd]").forEach(b=>b.onclick=()=>{ DB.rules.splice(Number(b.dataset.rd),1); save(); renderMas(); });
  q("#rule-add").onclick=()=>{ const kw=q("#rule-kw").value.trim(); if(!kw) return; DB.rules=DB.rules.filter(r=>r.kw.toLowerCase()!==kw.toLowerCase()); DB.rules.push({kw,cat:q("#rule-cat").value}); save(); renderMas(); toast("Regla agregada."); };
  q("#rule-apply").onclick=()=>{ let n=0; for(const m of DB.movs){ if(m.tipo==="transfer") continue; const t=" "+(m.nota||"").toLowerCase()+" ";
      const r=DB.rules.find(r=>t.includes(r.kw.toLowerCase()) && catList(m.tipo).includes(r.cat)); if(r && m.cat!==r.cat){ m.cat=r.cat; n++; } }
    save(); toast(n?`${n} movimiento(s) recategorizado(s).`:"No hubo cambios."); };
  // moneda
  q("#cur-main").onchange=e=>{ DB.settings.currency=e.target.value; if(DB.accounts.length===1 && !DB.movs.length) DB.accounts[0].currency=e.target.value; save(); renderMas(); toast(`Moneda principal: ${e.target.value}`); };
  q("#r-upd").onclick=async()=>{ q("#r-upd").textContent="Actualizando…"; const ok=await refreshRates(true); toast(ok?"Tasas actualizadas.":"No se pudo conectar. Revisa tu internet."); renderMas(); };
  q("#h-go").onclick=async()=>{ const c=q("#h-cur").value, d=q("#h-date").value; if(!d) return; q("#h-out").textContent="Consultando…";
    const [a,b]=await Promise.all([fetchRates(d),fetchRates("latest")]);
    if(!a){ q("#h-out").textContent="No hay datos para esa fecha o no hay conexión."; return; }
    const v=a.r[main().toLowerCase()]/a.r[c.toLowerCase()], now2=b?b.r[main().toLowerCase()]/b.r[c.toLowerCase()]:null;
    q("#h-out").innerHTML=`El ${a.date}: <b>1 ${c} = ${fmtC(v,main())}</b>${now2?` · Hoy: ${fmtC(now2,main())} (${now2>=v?"+":"−"}${Math.abs(Math.round((now2/v-1)*1000)/10)}%)`:""}`; };
  q("#h-12").onclick=async()=>{ const c=q("#h-cur").value; q("#h-out").textContent="Consultando 12 meses…";
    const ds=[]; for(let i=11;i>=1;i--) ds.push(shiftMonth(curMonth,-i)+"-01"); ds.push("latest");
    const res=await Promise.all(ds.map(d=>fetchRates(d)));
    const pts=res.map((r,i)=>r?{d:r.date||ds[i],v:r.r[main().toLowerCase()]/r.r[c.toLowerCase()]}:null).filter(Boolean);
    if(pts.length<2){ q("#h-out").textContent="No se pudo consultar. Revisa tu internet."; return; }
    const vs=pts.map(p=>p.v), mn=Math.min(...vs), mx=Math.max(...vs);
    q("#h-out").innerHTML=`<div class="line-chart" style="height:120px">${lineChartRange(vs)}</div><div class="lc-labels"><span>${pts[0].d}</span><span>${pts[pts.length-1].d}</span></div>
      <div style="margin-top:6px">1 ${c} en ${main()}: mínimo <b>${fmtC(mn,main())}</b>, máximo <b>${fmtC(mx,main())}</b>, hoy <b>${fmtC(vs[vs.length-1],main())}</b>.</div>`; };
  // temas
  q("#viz-open").onclick=openVizPanel;
  q("#swatches").onclick=e=>{ const b=e.target.closest("[data-theme]"); if(!b) return; DB.settings.theme=b.dataset.theme; applyTheme(DB.settings.theme); save(); renderMas(); };
  // borrar
  const w=q("#wipe"); w.onclick=()=>{ if(!w.classList.contains("armed")){ w.classList.add("armed"); w.textContent="Toca otra vez para confirmar"; return; }
    const keep={theme:DB.settings.theme, currency:DB.settings.currency};
    Object.keys(DB).forEach(k=>delete DB[k]); Object.assign(DB, migrate({settings:keep, demoHidden:true})); save(); renderAll(); toast("Se borraron todos los datos."); };
}
function lineChartRange(vals){
  const W=600,H=120,min=Math.min(...vals),max=Math.max(...vals),span=(max-min)||1;
  const pts=vals.map((v,i)=>`${(i/(vals.length-1)*W).toFixed(1)},${(H-(v-min)/span*(H-10)-5).toFixed(1)}`);
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true"><polyline points="${pts.join(" ")}" fill="none" stroke="var(--accent)" stroke-width="2.5" vector-effect="non-scaling-stroke" stroke-linejoin="round"/></svg>`;
}
function pickIcon(tipo, i){
  const md=openModal({title:"Elige un ícono", body:`<div class="icon-grid">${ICON_CHOICES.map(e=>`<button class="cic" data-ic="${e}" style="--c:${colorOf(DB.cats[tipo][i].n,tipo)}">${e}</button>`).join("")}</div>`});
  md.el.querySelectorAll("[data-ic]").forEach(b=>b.onclick=()=>{ DB.cats[tipo][i].i=b.dataset.ic; save(); md.close(); renderMas(); });
}
function toHexColor(c){ if(/^#[0-9a-f]{6}$/i.test(c)) return c; return "#888888"; }
function renameCat(tipo, i){
  const old=DB.cats[tipo][i].n;
  const body=document.createElement("form"); body.className="form-sheet";
  body.innerHTML=`<div class="field"><label for="rn">Nuevo nombre</label><input id="rn" value="${esc(old)}" maxlength="28"></div><button class="btn-primary" type="submit">Guardar</button>`;
  const md=openModal({title:"Renombrar categoría", body, sheet:false});
  body.onsubmit=e=>{ e.preventDefault(); const n=body.querySelector("#rn").value.trim(); if(!n||n===old) return md.close();
    if(catList(tipo).includes(n)) return toast("Ya existe una categoría con ese nombre.");
    DB.cats[tipo][i].n=n;
    DB.movs.forEach(m=>{ if(m.tipo===tipo&&m.cat===old) m.cat=n; }); DB.recs.forEach(r=>{ if(r.tipo===tipo&&r.cat===old) r.cat=n; });
    DB.rules.forEach(r=>{ if(r.cat===old) r.cat=n; }); if(tipo==="gasto" && DB.budgets[old]!=null){ DB.budgets[n]=DB.budgets[old]; delete DB.budgets[old]; }
    save(); md.close(); renderMas(); toast("Categoría renombrada."); };
}
function deleteCat(tipo, i){
  const old=DB.cats[tipo][i].n; DB.cats[tipo].splice(i,1); const fb=fallbackCat(tipo); let n=0;
  DB.movs.forEach(m=>{ if(m.tipo===tipo&&m.cat===old){ m.cat=fb; n++; } }); DB.recs.forEach(r=>{ if(r.tipo===tipo&&r.cat===old) r.cat=fb; });
  DB.rules=DB.rules.filter(r=>r.cat!==old); if(tipo==="gasto") delete DB.budgets[old];
  save(); renderMas(); toast(n?`Borrada. ${n} movimiento(s) pasaron a “${fb}”.`:"Categoría borrada.");
}

/* ================= pestañas y arranque ================= */
const ICONS={
  resumen:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="8"/><path d="M12 4v8l6 4"/></svg>',
  cuentas:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="6" width="18" height="13" rx="2.5"/><path d="M3 10h18M7 15h4"/></svg>',
  stats:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>',
  metas:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="4"/><circle cx="12" cy="12" r=".8" fill="currentColor"/></svg>',
  mas:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="5" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="19" cy="12" r="1.4"/></svg>'
};
const TABS=[["resumen","Resumen"],["cuentas","Cuentas"],["stats","Estadísticas"],["metas","Metas"],["mas","Más"]];
function paintTabs(){ const h=TABS.map(([k,l])=>`<button role="tab" data-tab="${k}" aria-selected="${UI.tab===k}">${ICONS[k]}<span>${l}</span></button>`).join(""); $("tabsTop").innerHTML=h; $("tabsBottom").innerHTML=h; }
function switchTab(t){ UI.tab=t; try{sessionStorage.setItem("fin.tab",t);}catch(e){} TABS.forEach(([k])=>$("v-"+k).hidden=k!==t); paintTabs(); renderAll(); window.scrollTo({top:0}); }
document.addEventListener("click",e=>{ const b=e.target.closest("[data-tab]"); if(b) switchTab(b.dataset.tab); });
function renderBanners(){
  const standalone = navigator.standalone===true || matchMedia("(display-mode: standalone)").matches;
  const isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent); let h="";
  if(!standalone && isIOS && !DB.installHidden) h+=`<div class="banner"><span>Para instalarla: toca <b>Compartir</b> y luego <b>Agregar a inicio</b>.</span><button data-bn="install">Entendido</button></div>`;
  if(showingDemo()) h+=`<div class="banner"><span>Estás viendo <b>datos de ejemplo</b>. Registra tu primer movimiento y desaparecen.</span><button data-bn="demo">Empezar en blanco</button></div>`;
  $("banners").innerHTML=h;
  $("banners").querySelectorAll("[data-bn]").forEach(b=>b.onclick=()=>{ if(b.dataset.bn==="install") DB.installHidden=true; else DB.demoHidden=true; save(); renderAll(); });
}
function renderAll(){
  renderBanners(); missingRates=false;
  ({resumen:renderResumen, cuentas:renderCuentas, stats:renderStats, metas:renderMetas, mas:renderMas})[UI.tab]();
  if(UI.tab==="resumen" && V().show.pagos){ const pc=paymentsCard(); if(pc){ const k=$("v-resumen").querySelector(".res-main > .kpis"); if(k) k.insertAdjacentHTML("afterend",pc); else $("v-resumen").querySelector(".res-main").insertAdjacentHTML("afterbegin",pc); bindPayments($("v-resumen")); } }
}
$("fab").onclick=()=>openMovForm(); $("addTop").onclick=()=>openMovForm();

genRecurring();
paintTabs(); switchTab(UI.tab);
if(DB.settings.pinHash) showLock();
refreshRates(false).then(ok=>{ if(ok && DB.accounts.some(a=>a.currency!==main())) renderAll(); });
if("serviceWorker" in navigator){
  const had=!!navigator.serviceWorker.controller; let rl=false;
  navigator.serviceWorker.addEventListener("controllerchange",()=>{ if(had&&!rl){ rl=true; location.reload(); } });
  addEventListener("load",()=>navigator.serviceWorker.register("sw.js").then(r=>r.update()).catch(()=>{}));
}

})();
</script>
</body>
