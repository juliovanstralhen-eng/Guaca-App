  const f=$("fileIn"); f.value=""; f.accept="image/*"; if(camera) f.setAttribute("capture","environment"); else f.removeAttribute("capture");
  f.onchange=()=>{ const file=f.files&&f.files[0]; f.removeAttribute("capture"); if(file) runScan(file); };
  f.click();
}
function startScan(force){
  if(DB.settings.scanTipsHidden && !force) return pickPhoto(true);
  const body=document.createElement("div");
  body.innerHTML=`<div class="tips">
    <p class="answer" style="margin:0">${tx("Para que la lectura salga bien, fíjate primero qué tipo de factura tienes:")}</p>
    <div class="tip best"><span class="tip-ic">${ICON_QR}</span><div><b>${tx("¿Tiene código QR? Tómale la foto al QR")}</b>
      <p>${tx("Es la forma más rápida y exacta: las facturas electrónicas guardan en el QR el total y la fecha oficiales. Acércate hasta que el QR ocupe buena parte de la pantalla y se vea nítido.")}</p><span class="tag">${tx("Recomendado")}</span></div></div>
    <div class="tip"><span class="tip-ic">${ICON_RC}</span><div><b>${tx("¿No tiene QR? Toma la parte de arriba y el TOTAL")}</b>
      <p>${tx("Que se vean el nombre del comercio (arriba) y la línea del TOTAL o VALOR A PAGAR. Si la factura es muy larga, dóblala para que ambas partes queden en la foto.")}</p></div></div>
    <ul class="tip-list"><li>☀️ ${tx("Buena luz, sin sombras ni reflejos del flash.")}</li><li>📄 ${tx("Factura plana y derecha, sin arrugas.")}</li><li>🔍 ${tx("Enfocada: toca la pantalla sobre el texto antes de disparar.")}</li></ul>
    <div class="row-btns" style="flex-direction:column"><button class="btn-primary" id="tp-cam">📷 ${tx("Tomar foto")}</button><button class="btn" id="tp-gal">🖼️ ${tx("Elegir de mis fotos")}</button></div>
    <label class="tip-hide"><input type="checkbox" id="tp-hide" ${DB.settings.scanTipsHidden?"checked":""}> ${tx("No volver a mostrar estos consejos")}</label>
  </div>`;
  const md=openModal({title:tx("Escanear factura"), body});
  const done = cam => { DB.settings.scanTipsHidden = body.querySelector("#tp-hide").checked; save(); md.close(); pickPhoto(cam); };
  body.querySelector("#tp-cam").onclick=()=>done(true);
  body.querySelector("#tp-gal").onclick=()=>done(false);
}
async function runScan(file){
  const body=document.createElement("div");
  body.innerHTML=`<div class="scan-box"><div class="scan-thumb"><img id="sc-img" alt=""><i class="scan-line"></i></div>
    <p class="answer" id="sc-msg" style="margin:0">${tx("Leyendo tu factura…")}</p>
    <div class="track" style="height:8px"><i id="sc-bar" style="width:5%"></i></div>
    <p class="small muted" id="sc-sub" style="margin:0">${tx("La primera vez tarda un poco más mientras se activa el lector (necesita internet).")}</p></div>`;
  const md=openModal({title:tx("Escanear factura"), body});
  let cancelled=false; md.card.querySelector(".x").addEventListener("click",()=>cancelled=true);
  const setP=(p,msg)=>{ const b=body.querySelector("#sc-bar"); if(b) b.style.width=Math.round(p*100)+"%"; if(msg) body.querySelector("#sc-msg").textContent=msg; };
  try{
    const canvas=await fileToCanvas(file, 1800);
    const thumb=(()=>{ const k=320/Math.max(canvas.width,canvas.height); const c=document.createElement("canvas"); c.width=canvas.width*k; c.height=canvas.height*k; c.getContext("2d").drawImage(canvas,0,0,c.width,c.height); return c.toDataURL("image/jpeg",0.7); })();
    body.querySelector("#sc-img").src=thumb;
    let qr=null;
    try{ setP(.08, tx("Buscando el código QR de la factura electrónica…")); await loadScript(SCAN_LIBS.qr); const rq=readQR(canvas); qr=rq?parseDianQR(rq.data):null; if(qr) qr.ratio=rq.ratio; }catch(e){}
    let res={monto:null,cands:[],fecha:null,merchant:null};
    if(!(qr && qr.ratio>0.12)) try{
      setP(.15, tx("Leyendo el texto de la factura…"));
      const w=await getWorker(m=>{ if(m.status==="recognizing text") setP(.3+m.progress*.68); else if(/load|init/.test(m.status||"")) setP(.15+(m.progress||0)*.15, tx("Activando el lector…")); });
      if(cancelled) return;
      const {data}=await w.recognize(prepCanvas(canvas));
      res=parseReceipt(data.text||"");
    }catch(e){ if(!qr) throw e; }
    if(cancelled) return;
    if(qr){ res.monto=qr.monto; res.cands=[qr.monto,...res.cands.filter(v=>v!==qr.monto)].slice(0,4); if(qr.fecha) res.fecha=qr.fecha; res.qr=true; }
    md.close();
    const nota = res.merchant || (qr&&qr.nit ? tx("Factura NIT {n}",{n:qr.nit}) : "");
    openMovForm(null, {tipo:"gasto", prefill:{monto:res.monto, fecha:res.fecha||todayISO, nota}, scan:{thumb, cands:res.cands, qr:!!res.qr, found:!!res.monto}});
  }catch(e){
    if(cancelled) return;
    setP(1, navigator.onLine===false ? tx("Sin conexión: la primera lectura necesita internet para activar el lector.") : tx("No pude leer la foto. Intenta con más luz y la factura completa en la imagen."));
    body.querySelector("#sc-sub").innerHTML=`<button class="btn" id="sc-retry">${tx("Tomar otra foto")}</button> <button class="btn-ghost" id="sc-manual">${tx("Escribirlo a mano")}</button>`;
    body.querySelector("#sc-sub").insertAdjacentHTML("afterbegin",`<button class="link" id="sc-tips" style="display:block;padding:0 0 8px">${tx("Ver cómo tomar la foto")}</button>`);
    body.querySelector("#sc-tips").onclick=()=>{ md.close(); startScan(true); };
    body.querySelector("#sc-retry").onclick=()=>{ md.close(); startScan(); };
    body.querySelector("#sc-manual").onclick=()=>{ md.close(); openMovForm(); };
  }
}

/* ---------- mensajes dinámicos ---------- */
function helloTitle(){
  const h = new Date().getHours(), n = firstName();
  const byTime = h>=5&&h<12 ? (n?"Buenos días, {n}":"Buenos días") : h>=12&&h<19 ? (n?"Buenas tardes, {n}":"Buenas tardes") : (n?"Buenas noches, {n}":"Buenas noches");
  return Math.random()<.5 ? byTime : (n?"¡Hola, {n}!":"¡Hola!");
}
function helloLine(){
  const generic = [
    tx("Te doy la bienvenida a tu guaca."), tx("Tu guaca te estaba esperando."), tx("Cada moneda que cuidas hoy es un tesoro mañana."),
    tx("Tu tesoro está a salvo aquí."), tx("Hoy es un buen día para cuidar tu plata."), tx("Pequeños pasos, grandes tesoros."),
    tx("Qué bueno verte. Tu guaca sigue creciendo.")
  ];
  const ctx = [];
  if(showingDemo()) ctx.push(tx("Empieza anotando tu primer gasto. Toma segundos."));
  else {
    const P = monthPayments(), late = P.filter(p=>p.st==="late"), today = P.filter(p=>p.st!=="ok" && p.inst.fecha===todayISO);
    if(late.length) ctx.push(tn(late.length,"Tienes {n} pago vencido. Lo resuelves en un toque.","Tienes {n} pagos vencidos. Los resuelves en un toque."));
    else if(today.length) ctx.push(tx("Hoy vence {x}. Lo tienes a un toque.",{x:today[0].r.nota||catName(today[0].r.cat)}));
    const gs = DB.goals.map(g=>({g, p:g.objetivo?goalSaved(g)/g.objetivo*100:0})).filter(x=>x.p<100).sort((a,b)=>b.p-a.p);
    if(gs.length && gs[0].p>=75) ctx.push(tx("Tu meta “{g}” va en {p}%. ¡Ya casi!",{g:gs[0].g.nombre,p:Math.floor(gs[0].p)}));
    else if(gs.length && gs[0].p>=30) ctx.push(tx("Vas en {p}% de “{g}”. Sigue así.",{g:gs[0].g.nombre,p:Math.floor(gs[0].p)}));
    const T = monthTotals(curMonth); if(now.getDate()>=10 && T.inc>0 && T.inc-T.out>0) ctx.push(tx("Este mes te quedan {a}. ¡Vas bien!",{a:fmt(T.inc-T.out)}));
    const last = DB.movs.filter(m=>!m.rec && m.fecha<=todayISO).map(m=>m.fecha).sort().pop();
    if(last){ const d = Math.round((new Date(todayISO)-new Date(last))/864e5); if(d>=3) ctx.push(tx("Hace {n} días no anotas nada. ¿Registramos lo de hoy?",{n:d})); }
  }
  const dow = now.getDay();
  if(dow===1) generic.push(tx("Nueva semana, nuevas metas. ¡Tú puedes!"));
  if(dow===5) generic.push(tx("¡Es viernes! Disfruta sin descuadrar tu guaca."));
  let pool = ctx.length && (Math.random()<.7) ? ctx.slice(0,2) : generic;
  const lastShown = DB.settings.helloLast; let s = pick(pool);
  if(pool.length>1 && s===lastShown) s = pick(pool.filter(x=>x!==s));
  DB.settings.helloLast = s; save();
  return s;
}
/* Convierte un título con {n} en palabras que entran una por una; el nombre va resaltado */
function animWords(key, name, d0=0){
  const raw = tx(key, {n:"\u0001"});
  return raw.split(" ").map((w,i)=>{
    const html = esc(w).replace("\u0001", `<span class="nm">${esc(name)}</span>`);
    return `<span class="w" style="--d:${d0+i*90}ms">${html}</span>`;
  }).join(" ");
}

/* ---------- saludo al abrir ---------- */
let helloBusy = false, helloDue = false;
function hello(force){
  if(helloBusy) return;
  if(!DB.settings.userName && !DB.settings.nameAsked) return askName();
  if(!force && DB.settings.greet===false) return;
  greet();
}
function helloLayer(inner){
  const ov = document.createElement("div"); ov.className = "hola"; ov.setAttribute("role","dialog"); ov.setAttribute("aria-modal","true");
  ov.innerHTML = `<div class="hola-blob b1"></div><div class="hola-blob b2"></div><div class="hola-blob b3"></div><div class="hola-in">${inner}</div>`;
  document.body.appendChild(ov); document.documentElement.classList.add("hola-open");
  return ov;
}
function closeLayer(ov){ ov.remove(); if(!document.querySelector(".hola")) document.documentElement.classList.remove("hola-open"); helloBusy=false; }
function greet(ovIn){
  helloBusy = true;
  const rm = reduceMotion(), n = firstName();
  const body = `<div class="hola-m">${mascotSVG("char wave")}</div>
    <h1 class="hola-t" aria-live="polite">${animWords(helloTitle(), n, 250)}</h1>
    <p class="hola-s" style="--d:${rm?0:900}ms">${esc(helloLine())}</p>
    <p class="hola-tap">${tx("Toca para continuar")}</p>`;
  let ov = ovIn;
  if(ov){ ov.querySelector(".hola-in").innerHTML = body; } else ov = helloLayer(body);
  requestAnimationFrame(()=>ov.classList.add("go"));
  const svg = ov.querySelector(".masc");
  let done = false, timers = [];
  const T = (ms, f) => timers.push(setTimeout(f, ms));
  const finish = () => {
    if(done) return; done = true; timers.forEach(clearTimeout);
    // el personaje se vuelve el logo y vuela a su lugar en la barra de arriba
    svg.classList.remove("wave"); svg.classList.add("logo");
    const target = document.querySelector(".top .brand img"), r = target && target.getBoundingClientRect();
    setTimeout(()=>{
      if(!rm && r && r.width && r.top>=0 && r.top<innerHeight){
        const s = svg.getBoundingClientRect();
        svg.style.transform = `translate(${r.left+r.width/2-(s.left+s.width/2)}px,${r.top+r.height/2-(s.top+s.height/2)}px) scale(${r.width/s.width})`;
        svg.classList.add("fly");
      }
      ov.classList.add("out");
      setTimeout(()=>closeLayer(ov), rm?150:620);
    }, rm?0:560);
  };
  if(!rm){ T(1350, ()=>svg.classList.add("blink")); T(2500, finish); }
  else T(1800, finish);
  ov.addEventListener("click", finish);
  ov.addEventListener("keydown", e=>{ if(e.key==="Escape"||e.key==="Enter") finish(); });
}
function askName(){
  helloBusy = true;
  const ov = helloLayer(`<div class="hola-m">${mascotSVG("char wave")}</div>
    <h1 class="hola-t">${animWords("¡Hola! Soy Guaca 👋", "", 200)}</h1>
    <p class="hola-s" style="--d:700ms">${tx("¿Cómo te llamas? Así te saludo cada vez que abras tu guaca.")}</p>
    <form class="hola-f" style="--d:1000ms"><input id="hola-n" maxlength="30" autocomplete="given-name" autocapitalize="words" placeholder="${tx("Tu nombre")}" aria-label="${tx("Tu nombre")}">
      <button class="btn-primary" type="submit">${tx("Continuar")}</button>
      <button class="btn-ghost" type="button" id="hola-skip">${tx("Ahora no")}</button></form>`);
  requestAnimationFrame(()=>ov.classList.add("go"));
  const f = ov.querySelector("form"), inp = ov.querySelector("#hola-n");
  setTimeout(()=>{ try{ inp.focus({preventScroll:true}); }catch(e){} }, 900);
  f.onsubmit = e => { e.preventDefault(); const v = inp.value.trim().replace(/\s+/g," ").slice(0,30); if(!v){ inp.focus(); return; }
    DB.settings.userName = v; DB.settings.nameAsked = true; save(); if(UI.tab==="mas") renderMas(); greet(ov); };
  ov.querySelector("#hola-skip").onclick = () => { DB.settings.nameAsked = true; save(); ov.classList.add("out"); setTimeout(()=>closeLayer(ov), 400); };
}
function afterUnlock(){ if(helloDue){ helloDue=false; hello(); } }
let helloHiddenAt = 0;
document.addEventListener("visibilitychange", ()=>{
  if(document.hidden){ helloHiddenAt = Date.now(); return; }
  if(helloHiddenAt && Date.now()-helloHiddenAt > 30*60000 && DB.settings.greet!==false && DB.settings.userName){
    if(!$("lock").hidden) helloDue = true; else hello();
  }
});

/* ---------- metas: al crearla y al cumplirla ---------- */
function celebrate(kind, g){
  const rm = reduceMotion(), n = firstName(), c = main();
  let title, lines = [], btns;
  if(kind==="new"){
    title = n ? pick(["¡Arrancamos, {n}!","¡A llenar la guaca, {n}!"]) : pick(["¡Meta creada!","¡A llenar la guaca!"]);
    const rem = Math.max(0, g.objetivo - goalSaved(g));
    if(g.fecha){ const m = monthsDiff(curMonth, monthKey(g.fecha)); if(m>0 && rem>0) lines.push(tx("Para “{g}” necesitas {a} al mes. ¡Tú puedes con esto!",{g:g.nombre,a:fmt(rem/m)})); }
    if(!lines.length) lines.push(tx("“{g}” ya tiene quien la cuide: tú.",{g:g.nombre}));
    lines.push(pick([tx("Todo tesoro empieza con la primera moneda."), tx("Lo que se escribe, se cumple."), tx("Un aporte a la vez. Tu yo del futuro te lo va a agradecer."), tx("Los sueños grandes se pagan en cuotas pequeñas.")]));
    btns = `<button class="btn-primary" data-x>${tx("¡Vamos!")}</button>`;
  } else {
    title = n ? "¡Lo lograste, {n}!" : "¡Meta cumplida!";
    lines.push(tx("Completaste “{g}”: {o} ahorrados.",{g:g.nombre,o:fmtC(g.objetivo,c)}));
    lines.push(pick([tx("Eso es disciplina de verdad. Tu guaca brilla más que nunca."), tx("Date un gusto: te lo ganaste."), tx("Lo prometiste y lo cumpliste. ¿Cuál es el próximo tesoro?")]));
    btns = `<button class="btn-primary" data-x>${tx("¡Gracias!")}</button><button class="btn-ghost" data-new>${tx("Crear otra meta")}</button>`;
  }
  const ov = document.createElement("div"); ov.className = "cele "+kind; ov.setAttribute("role","dialog"); ov.setAttribute("aria-modal","true");
  ov.innerHTML = `<div class="fx" aria-hidden="true"></div><div class="cele-card">
    <div class="cele-m">${mascotSVG("char "+(kind==="done"?"jump":"wave"))}</div>
    <div class="cele-k">${kind==="done"?"🏆 "+tx("Meta cumplida"):"🎯 "+tx("Nueva meta")}</div>
    <h2 class="hola-t">${animWords(title, n, 150)}</h2>
    ${lines.map((l,i)=>`<p class="hola-s" style="--d:${rm?0:550+i*250}ms">${esc(l)}</p>`).join("")}
    <div class="cele-b" style="--d:${rm?0:900}ms">${btns}</div></div>`;
  document.body.appendChild(ov); document.documentElement.classList.add("hola-open");
  // chispas al crear, confeti de plumas y monedas al cumplir
  if(!rm){
    const fx = ov.querySelector(".fx"), cols = ["#F2385A","#FFC53D","#20B8D8","#4F46E5","#12B76A","#FF6B4A"];
    const count = kind==="done" ? 90 : 26;
    fx.innerHTML = Array.from({length:count},(_,i)=>{
      if(kind==="done"){
        const coin = i%6===0, x = Math.random()*100, dx = (Math.random()*2-1)*18, rot = Math.round(Math.random()*720-360), dur = 1.9+Math.random()*1.6, del = Math.random()*.9;
        return `<i class="${coin?"coin":"conf"}" style="left:${x}%;--dx:${dx}vw;--r:${rot}deg;--c:${cols[i%cols.length]};animation-duration:${dur}s;animation-delay:${del}s"></i>`;
      }
      const a = i/count*Math.PI*2, d = 80+Math.random()*70;
      return `<i class="spark" style="--x:${Math.cos(a)*d}px;--y:${Math.sin(a)*d}px;--c:${cols[i%cols.length]};animation-delay:${.15+Math.random()*.2}s"></i>`;
    }).join("");
    if(kind==="new"){ const s = document.createElement("div"); s.className = "fx-s"; s.setAttribute("aria-hidden","true"); s.innerHTML = fx.innerHTML; fx.innerHTML = ""; ov.querySelector(".cele-m").appendChild(s); }
    if(kind==="done" && navigator.vibrate) try{ navigator.vibrate([30,60,30]); }catch(e){}
  }
  requestAnimationFrame(()=>ov.classList.add("go"));
  const close = () => { ov.classList.add("out"); setTimeout(()=>{ ov.remove(); if(!document.querySelector(".hola,.cele")) document.documentElement.classList.remove("hola-open"); }, 300); };
  ov.querySelector("[data-x]").onclick = close;
  const nw = ov.querySelector("[data-new]"); if(nw) nw.onclick = () => { close(); setTimeout(()=>openGoalForm(), 320); };
  ov.addEventListener("click", e => { if(e.target===ov) close(); });
}
/* Revisa si una meta se acaba de cumplir (o dejó de estarlo tras un retiro) */
function checkGoalDone(g){
  if(!g) return false;
  const ok = g.objetivo>0 && goalSaved(g) >= g.objetivo;
  if(ok && !g.doneAt){ g.doneAt = todayISO; save(); setTimeout(()=>celebrate("done", g), 250); return true; }
  if(!ok && g.doneAt){ delete g.doneAt; save(); }
  return false;
}

function lineChartRange(vals){
  const W=600,H=120,min=Math.min(...vals),max=Math.max(...vals),span=(max-min)||1;
  const pts=vals.map((v,i)=>`${(i/(vals.length-1)*W).toFixed(1)},${(H-(v-min)/span*(H-10)-5).toFixed(1)}`);
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true"><polyline points="${pts.join(" ")}" fill="none" stroke="var(--accent)" stroke-width="2.5" vector-effect="non-scaling-stroke" stroke-linejoin="round"/></svg>`;
}
function pickIcon(tipo, i){
  const md=openModal({title:tx("Elige un ícono"), body:`<div class="icon-grid">${ICON_CHOICES.map(e=>`<button class="cic" data-ic="${e}" style="--c:${colorOf(DB.cats[tipo][i].n,tipo)}">${e}</button>`).join("")}</div>`});
  md.el.querySelectorAll("[data-ic]").forEach(b=>b.onclick=()=>{ DB.cats[tipo][i].i=b.dataset.ic; save(); md.close(); renderMas(); });
}
function toHexColor(c){ if(/^#[0-9a-f]{6}$/i.test(c)) return c; return "#888888"; }
function renameCat(tipo, i){
  const old=DB.cats[tipo][i].n;
  const body=document.createElement("form"); body.className="form-sheet";
  body.innerHTML=`<div class="field"><label for="rn">${tx("Nuevo nombre")}</label><input id="rn" value="${esc(catName(old))}" maxlength="28"></div><button class="btn-primary" type="submit">${tx("Guardar")}</button>`;
  const md=openModal({title:tx("Renombrar categoría"), body, sheet:false});
  body.onsubmit=e=>{ e.preventDefault(); const n=body.querySelector("#rn").value.trim(); if(!n||n===old||n===catName(old)) return md.close();
    if(catList(tipo).includes(n)) return toast(tx("Ya existe una categoría con ese nombre."));
    DB.cats[tipo][i].n=n;
    DB.movs.forEach(m=>{ if(m.tipo===tipo&&m.cat===old) m.cat=n; }); DB.recs.forEach(r=>{ if(r.tipo===tipo&&r.cat===old) r.cat=n; });
    DB.rules.forEach(r=>{ if(r.cat===old) r.cat=n; }); if(tipo==="gasto" && DB.budgets[old]!=null){ DB.budgets[n]=DB.budgets[old]; delete DB.budgets[old]; }
    save(); md.close(); renderMas(); toast(tx("Categoría renombrada.")); };
}
function deleteCat(tipo, i){
  const old=DB.cats[tipo][i].n; DB.cats[tipo].splice(i,1); const fb=fallbackCat(tipo); let n=0;
  DB.movs.forEach(m=>{ if(m.tipo===tipo&&m.cat===old){ m.cat=fb; n++; } }); DB.recs.forEach(r=>{ if(r.tipo===tipo&&r.cat===old) r.cat=fb; });
  DB.rules=DB.rules.filter(r=>r.cat!==old); if(tipo==="gasto") delete DB.budgets[old];
  save(); renderMas(); toast(n?tx("Borrada. {n} movimiento(s) pasaron a “{c}”.",{n,c:catName(fb)}):tx("Categoría borrada."));
}

  if(!$("lock").hidden) showLock(lockMode);
}
function switchTab(k){ UI.tab=k; try{sessionStorage.setItem("fin.tab",k);}catch(e){} TABS.forEach(([x])=>$("v-"+x).hidden=x!==k); paintTabs(); renderAll(); window.scrollTo({top:0}); }
document.addEventListener("click",e=>{ const b=e.target.closest("[data-tab]"); if(b) switchTab(b.dataset.tab); });
function renderBanners(){
  const standalone = navigator.standalone===true || matchMedia("(display-mode: standalone)").matches;
  const isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent); let h="";
  if(!standalone && isIOS && !DB.installHidden) h+=`<div class="banner"><span>${tx("Para instalarla: toca <b>Compartir</b> y luego <b>Agregar a inicio</b>.")}</span><button data-bn="install">${tx("Entendido")}</button></div>`;
  if(showingDemo()) h+=`<div class="banner"><span>${tx("Estás viendo <b>datos de ejemplo</b>. Registra tu primer movimiento y desaparecen.")}</span><button data-bn="demo">${tx("Empezar en blanco")}</button></div>`;
  $("banners").innerHTML=h;
  $("banners").querySelectorAll("[data-bn]").forEach(b=>b.onclick=()=>{ if(b.dataset.bn==="install") DB.installHidden=true; else DB.demoHidden=true; save(); renderAll(); });
}
function renderAll(){
  renderBanners(); missingRates=false;
  ({resumen:renderResumen, cuentas:renderCuentas, stats:renderStats, metas:renderMetas, mas:renderMas})[UI.tab]();
  if(UI.tab==="resumen" && V().show.pagos){ const pc=paymentsCard(); if(pc){ const k=$("v-resumen").querySelector(".res-main > .kpis"); if(k) k.insertAdjacentHTML("afterend",pc); else $("v-resumen").querySelector(".res-main").insertAdjacentHTML("afterbegin",pc); bindPayments($("v-resumen")); } }
}
$("fab").onclick=()=>openMovForm(); $("addTop").onclick=()=>openMovForm(); $("fabScan").onclick=startScan; $("scanTop").onclick=startScan;

genRecurring();
paintStatic(); paintTabs(); switchTab(UI.tab);
if(DB.settings.pinHash){ showLock(); helloDue=true; } else hello();
refreshRates(false).then(ok=>{ if(ok && DB.accounts.some(a=>a.currency!==main())) renderAll(); });
if("serviceWorker" in navigator){
  const had=!!navigator.serviceWorker.controller; let rl=false;
  navigator.serviceWorker.addEventListener("controllerchange",()=>{ if(had&&!rl){ rl=true; location.reload(); } });
  addEventListener("load",()=>navigator.serviceWorker.register("sw.js").then(r=>r.update()).catch(()=>{}));
}

})();
</script>
