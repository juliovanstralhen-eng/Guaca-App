<script>
/* Temas de color: se aplican antes de pintar para evitar parpadeos */
window.THEMES = [
  {id:"vivo",       name:"Vivo",        accent:"#4F46E5", mode:"vivid-light", style:"vivid"},
  {id:"vivo-noche", name:"Vivo noche",  accent:"#7C83FF", mode:"vivid-dark",  style:"vivid"},
  {id:"terracota", name:"Terracota", accent:"#D2673F", mode:"dark"},
  {id:"esmeralda", name:"Esmeralda", accent:"#3DAE7B", mode:"dark"},
  {id:"oceano",    name:"Océano",    accent:"#4A94E0", mode:"dark"},
  {id:"violeta",   name:"Violeta",   accent:"#9D72E8", mode:"dark"},
  {id:"oro",       name:"Oro",       accent:"#D8A23A", mode:"dark"},
  {id:"coral",     name:"Coral",     accent:"#E8657F", mode:"dark"},
  {id:"claro",     name:"Claro cálido", accent:"#C4552E", mode:"light"},
  {id:"claro-azul",name:"Claro azul",   accent:"#2F74C0", mode:"light"}
];
/* Paleta viva: cada categoría con un color que coincide con lo que evoca */
window.VIVID = {
  "Supermercado":"#84CC16",        /* lima: fresco, comida */
  "Comidas afuera":"#FF8A3D",      /* naranja: apetito, sociabilidad */
  "Transporte":"#3B82F6",          /* azul: movimiento, confianza */
  "Arriendo y servicios":"#6366F1",/* índigo: estabilidad, hogar */
  "Salud":"#14B8A6",               /* turquesa: calma, bienestar */
  "Suscripciones":"#A855F7",       /* violeta: digital, entretenimiento */
  "Ropa":"#EC4899",                /* rosa: expresión personal */
  "Tecnología":"#0EA5E9",         /* celeste: innovación, claridad */
  "Ocio":"#FACC15",                /* amarillo: alegría */
  "Ahorro":"#10B981",              /* esmeralda: crecimiento */
  "Otros":"#94A3B8",               /* gris pizarra: neutro */
  "Salario":"#12B76A", "Freelance":"#06B6D4", "Otros ingresos":"#8B5CF6"
};
window.VIVID_EXTRA = ["#F43F5E","#0EA5E9","#D946EF","#EAB308","#22C55E","#F97316","#8B5CF6","#06B6D4"];
(function(){
  const hx = h => [1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
  const toHex = a => "#"+a.map(v=>Math.round(Math.max(0,Math.min(255,v))).toString(16).padStart(2,"0")).join("");
  const mix = (a,b,t) => { const A=hx(a),B=hx(b); return toHex(A.map((v,i)=>v+(B[i]-v)*t)); };
  window.themeVars = function(t){
    const a = t.accent, v = {"--accent":a};
    if(t.mode==="vivid-light"){
      Object.assign(v,{"--bg":"#F3F5FB","--panel":"#FFFFFF","--panel-2":"#EEF1F8","--line":"#E0E5F0","--row":"#EDF0F6",
        "--text":"#141A33","--text-2":"#3A4260","--muted":"#6B7390","--faint":"#A0A7BE",
        "--accent-2":"#4338CA","--accent-deep":"#EEF0FF","--accent-line":"#C7CBFF","--accent-soft":"#4F46E5",
        "--bar":"#C7CBFF","--bar-none":"#E0E5F0","--on-accent":"#FFFFFF","--hl-a":"#EEF0FF","--hl-b":"#F7F7FF",
        "--good":"#12B76A","--danger":"#F04438","--danger-bg":"#FEE4E2","--toast":"#141A33","--spend":"#FF6B4A","--save":"#F5A524",
        "--hero":"linear-gradient(135deg,#4F46E5 0%,#7C3AED 55%,#DB2777 130%)","--fab":"linear-gradient(135deg,#FFB020,#FF6B4A)","--shadow":"0 1px 2px rgba(20,26,51,.05),0 10px 30px rgba(20,26,51,.07)",
        "--scheme":"light"});
    } else if(t.mode==="vivid-dark"){
      Object.assign(v,{"--bg":"#0D1122","--panel":"#161B33","--panel-2":"#1E2442","--line":"#2A3154","--row":"#1F2544",
        "--text":"#F2F4FF","--text-2":"#CDD2EE","--muted":"#8D94B8","--faint":"#5D6488",
        "--accent-2":"#A5AAFF","--accent-deep":"#232A5C","--accent-line":"#3E4690","--accent-soft":"#B4B8FF",
        "--bar":"#3E4690","--bar-none":"#2A3154","--on-accent":"#0D1122","--hl-a":"#232A5C","--hl-b":"#1B2150",
        "--good":"#32D583","--danger":"#FF6B5E","--danger-bg":"#3D1A22","--toast":"#232A4A","--spend":"#FF8A6B","--save":"#FFC24D",
        "--hero":"linear-gradient(135deg,#5B54F0 0%,#8B3FF0 55%,#E0368C 130%)","--fab":"linear-gradient(135deg,#FFB020,#FF6B4A)","--shadow":"none",
        "--scheme":"dark"});
    } else if(t.mode==="dark"){
      Object.assign(v,{
        "--bg":mix(a,"#0A0A0A",.97),"--panel":mix(a,"#161616",.96),"--panel-2":mix(a,"#1F1F1F",.95),
        "--line":mix(a,"#2C2C2C",.93),"--row":mix(a,"#202020",.96),
        "--text":"#F3EFEB","--text-2":"#D8D2CD","--muted":"#968F8A","--faint":"#645E5A",
        "--accent-2":mix(a,"#FFFFFF",.2),"--accent-deep":mix(a,"#0A0A0A",.84),"--accent-line":mix(a,"#0A0A0A",.6),
        "--accent-soft":mix(a,"#FFFFFF",.55),"--bar":mix(a,"#0A0A0A",.4),"--bar-none":mix(a,"#0A0A0A",.7),
        "--on-accent":mix(a,"#000000",.86),"--hl-a":mix(a,"#0A0A0A",.86),"--hl-b":mix(a,"#0A0A0A",.91),
        "--good":"#7FB58A","--danger":"#F0705A","--danger-bg":"#3A1812","--toast":mix(a,"#262626",.93),
        "--spend":"var(--text)","--save":"var(--accent-2)","--hero":"none","--fab":"var(--accent)","--shadow":"none",
        "--scheme":"dark"
      });
    } else {
      Object.assign(v,{
        "--bg":mix(a,"#F4F1ED",.96),"--panel":"#FFFFFF","--panel-2":mix(a,"#F1EDE8",.96),
        "--line":mix(a,"#E2DCD5",.95),"--row":mix(a,"#EFEAE4",.97),
        "--text":"#1D1916","--text-2":"#3B3430","--muted":"#736A63","--faint":"#A39A92",
        "--accent-2":mix(a,"#000000",.12),"--accent-deep":mix(a,"#FFFFFF",.88),"--accent-line":mix(a,"#FFFFFF",.55),
        "--accent-soft":mix(a,"#000000",.3),"--bar":mix(a,"#FFFFFF",.45),"--bar-none":mix(a,"#FFFFFF",.75),
        "--on-accent":"#FFFFFF","--hl-a":mix(a,"#FFFFFF",.9),"--hl-b":mix(a,"#FFFFFF",.95),
        "--good":"#2E8B4E","--danger":"#C7402A","--danger-bg":"#FCE5DF","--toast":"#2A2522",
        "--spend":"var(--text)","--save":"var(--accent-2)","--hero":"none","--fab":"var(--accent)","--shadow":"none",
        "--scheme":"light"
      });
    }
    if(t.style==="vivid"){ v.ramp = ["#84CC16","#FF8A3D","#3B82F6","#6366F1","#14B8A6","#A855F7","#EC4899","#FACC15","#10B981","#94A3B8"]; }
    else {
      const light = t.mode==="dark" ? mix(a,"#FFFFFF",.55) : mix(a,"#FFFFFF",.5);
      const dark = mix(a,"#000000",.55);
      const steps = Array.from({length:10},(_,i)=> i<5 ? mix(light,a,i/4.5) : mix(a,dark,(i-4.5)/5));
      v.ramp = [3,1,5,7,0,2,6,9,4,8].map(i=>steps[i]);
    }
    return v;
  };
  window.applyTheme = function(id){
    const t = THEMES.find(x=>x.id===id) || THEMES[0];
    const v = themeVars(t), r = document.documentElement;
    for(const k in v){ if(k.startsWith("--")) r.style.setProperty(k, v[k]); }
    r.style.colorScheme = v["--scheme"];
    r.dataset.style = t.style || "plain";
    window.RAMP = v.ramp; window.IS_VIVID = t.style==="vivid";
    const m = document.getElementById("themeColor"); if(m) m.setAttribute("content", v["--bg"]);
    return t;
  };
  let id = "vivo";
  try{ const d = JSON.parse(localStorage.getItem("finanzas.v1")||"null"); if(d && d.settings && d.settings.theme) id = d.settings.theme; }catch(e){}
  applyTheme(id);
})();
</script>

<style>
@font-face{font-family:"Bricolage";src:url(bricolage-grotesque-latin-600-normal.woff2) format("woff2");font-weight:600;font-display:swap}
@font-face{font-family:"Bricolage";src:url(bricolage-grotesque-latin-700-normal.woff2) format("woff2");font-weight:700;font-display:swap}
@font-face{font-family:"Bricolage";src:url(bricolage-grotesque-latin-800-normal.woff2) format("woff2");font-weight:800;font-display:swap}
@font-face{font-family:"Instrument";src:url(instrument-sans-latin-400-normal.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Instrument";src:url(instrument-sans-latin-500-normal.woff2) format("woff2");font-weight:500;font-display:swap}
@font-face{font-family:"Instrument";src:url(instrument-sans-latin-600-normal.woff2) format("woff2");font-weight:600;font-display:swap}
:root{
  color-scheme: dark;
  --bg:#0B0A09; --panel:#171514; --panel-2:#201D1B; --line:#2E2A27; --row:#221F1D;
  --text:#F3EDE8; --text-2:#D8D0CA; --muted:#968C85; --faint:#645C57;
  --accent:#D2673F; --accent-2:#E88A62; --accent-deep:#2A1710; --accent-line:#5A2E1D; --accent-soft:#E7B39A;
  --bar:#8E4529; --bar-none:#5A3526; --on-accent:#1A0C06; --hl-a:#24140E; --hl-b:#1A1310;
  --good:#7FB58A; --danger:#F0705A; --danger-bg:#3A1812; --toast:#2A2522;
  --display:"Bricolage","Arial Narrow",system-ui,sans-serif;
  --ui:"Instrument",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:14px; --tabh:62px;
  --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);margin:0}
body{color:var(--text);font-family:var(--ui);font-size:14px;line-height:1.4;
  padding:calc(var(--st) + 14px) max(16px,env(safe-area-inset-right,0px)) calc(var(--sb) + 40px) max(16px,env(safe-area-inset-left,0px));
  -webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--accent-2);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.app{max-width:1360px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h2.vt{font-family:var(--display);font-weight:700;font-size:24px;letter-spacing:-.02em;margin:4px 0 0}

/* header & tabs */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:-.02em}
.tabs{display:flex;gap:4px;background:var(--panel);border-radius:12px;padding:4px}
.tabs button{border:0;background:transparent;border-radius:9px;padding:7px 14px;color:var(--muted);font-weight:500;display:flex;align-items:center;gap:7px}
.tabs button svg{width:18px;height:18px}
.tabs button[aria-selected="true"]{background:var(--panel-2);color:var(--text)}
.btn-add{border:0;background:var(--accent);color:var(--on-accent);border-radius:10px;padding:9px 14px;font-weight:600}
.month-nav{display:flex;align-items:center;gap:6px}
.month-nav button,.icon-btn{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--panel);display:grid;place-items:center;font-size:16px;flex:none}
.month-label{min-width:140px;text-align:center;font-weight:600;text-transform:capitalize}
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.sel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:7px 10px;min-height:36px;max-width:100%}

.banner{display:flex;align-items:center;justify-content:space-between;gap:10px 12px;flex-wrap:wrap;background:var(--accent-deep);border:1px solid var(--accent-line);border-radius:12px;padding:10px 14px;color:var(--accent-soft);font-size:13px}
.banner button{background:transparent;border:1px solid var(--accent-line);border-radius:8px;padding:6px 10px;color:var(--text)}
.banner.warn{background:var(--danger-bg);border-color:var(--danger);color:var(--text)}

.card{background:var(--panel);border-radius:var(--r);padding:18px;min-width:0}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.card-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.muted{color:var(--muted)} .faint{color:var(--faint)} .good{color:var(--good)} .bad{color:var(--danger)}
.small{font-size:12.5px}
.btn{border:1px solid var(--line);background:var(--panel-2);border-radius:10px;padding:8px 12px;font-weight:500;font-size:13.5px}
.btn:hover{border-color:var(--faint)}
.btn-primary{border:1px solid var(--accent);background:transparent;border-radius:10px;padding:11px;font-weight:600;color:var(--text)}
.btn-primary:active,.btn-primary:hover{background:var(--accent);color:var(--on-accent)}
.btn-primary:disabled{opacity:.4;background:transparent;color:var(--text);cursor:default}
.btn-ghost{border:0;background:transparent;color:var(--muted);font-size:13px;padding:6px}
.btn-danger{border:1px solid var(--danger);background:transparent;border-radius:10px;padding:8px 12px;color:var(--danger);font-size:13.5px}
.btn-danger.armed{background:var(--danger);color:#fff}
.row-btns{display:flex;gap:8px;flex-wrap:wrap}
.chipset{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid transparent;background:var(--panel-2);border-radius:999px;padding:6px 12px;font-size:13px;color:var(--text-2);display:inline-flex;align-items:center;gap:6px}
.chip i{width:8px;height:8px;border-radius:50%}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);font-weight:600}
.chip[aria-pressed="true"] i{background:var(--on-accent)!important}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.seg button{border:1px solid var(--line);background:transparent;border-radius:9px;padding:9px 4px;color:var(--muted);font-weight:500}
.seg button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent-2);background:var(--accent-deep)}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label,.flabel{font-size:12px;color:var(--muted)}
.field input,.field select,.inp{background:var(--panel-2);border:1px solid var(--line);border-radius:9px;padding:9px 11px;outline:0;width:100%;min-height:40px}
.field input:focus,.field select:focus,.inp:focus{border-color:var(--accent)}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.amount{display:flex;align-items:baseline;gap:6px;border-bottom:1px solid var(--line);padding-bottom:10px}
.amount span{font-family:var(--display);font-size:26px;color:var(--faint);white-space:nowrap}
.amount input{background:transparent;border:0;outline:0;font-family:var(--display);font-weight:700;font-size:32px;width:100%;letter-spacing:-.02em;min-width:0}
.amount input::placeholder{color:var(--faint)}
.amount:focus-within{border-color:var(--accent)}
.switch-row{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--panel-2);border-radius:10px;padding:10px 12px}
.switch-row .lbl b{display:block;font-size:13.5px;font-weight:600}
.switch-row .lbl small{color:var(--muted);font-size:11.5px}
.switch{position:relative;width:44px;height:26px;flex:none}
.switch input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer}
.switch i{position:absolute;inset:0;border-radius:99px;background:var(--line);transition:background .2s;pointer-events:none}
.switch i::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .2s}
.switch input:checked + i{background:var(--accent)}
.switch input:checked + i::after{transform:translateX(18px)}
.msg{font-size:12.5px;min-height:1em;color:var(--muted)} .msg.err{color:var(--danger)}

/* resumen */
.res-grid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:14px;align-items:start}
.res-main{display:flex;flex-direction:column;gap:14px;min-width:0}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.kpi{background:var(--panel);border-radius:var(--r);padding:16px 18px;display:flex;flex-direction:column;gap:8px;border:1px solid transparent;min-width:0}
.kpi .v{font-family:var(--display);font-weight:800;font-size:clamp(22px,2.4vw,30px);letter-spacing:-.03em;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .sub{font-size:12px;color:var(--faint)}
.kpi.hl{border-color:var(--accent);background:linear-gradient(180deg,var(--hl-a),var(--hl-b))}
.kpi.hl .eyebrow{color:var(--accent-soft)}.kpi.hl .v{color:var(--accent-2)}
.kpi.neg{border-color:var(--danger)}.kpi.neg .v{color:var(--danger)}
.row2{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:14px}
.donut-wrap{display:flex;gap:22px;align-items:center;flex-wrap:wrap}
.donut{position:relative;width:176px;height:176px;flex:none}
.donut svg{width:100%;height:100%;transform:rotate(-90deg)}
.donut .c{position:absolute;inset:0;display:grid;place-content:center;text-align:center;padding:0 30px}
.donut .c b{font-family:var(--display);font-size:17px;letter-spacing:-.02em}
.donut .c small{color:var(--muted);font-size:11px}
.legend{flex:1;min-width:210px;display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:8px 18px}
.lg{display:grid;grid-template-columns:8px 1fr auto;gap:8px;align-items:center;font-size:12.5px;color:var(--text-2)}
.lg i{width:8px;height:8px;border-radius:50%}
.lg em{font-style:normal;color:var(--muted)}
.empty{color:var(--faint);font-size:13px;padding:20px 0;text-align:center}
.bars{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:8px;align-items:end;height:170px;padding-top:22px}
.bar{display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end;min-width:0;border:0;background:transparent;padding:0}
.bar .col{flex:1;width:100%;display:flex;align-items:flex-end;justify-content:center;gap:3px;position:relative}
.bar .b{flex:1;max-width:24px;background:var(--bar);border-radius:4px 4px 2px 2px;min-height:2px;transition:height .4s ease}
.bar .b.in{background:var(--good);opacity:.85}
.bar.cur .b.out,.bar.sel .b.out{background:var(--accent)}
.bar .lbl{font-size:11px;color:var(--muted);text-transform:capitalize;white-space:nowrap}
.bar.cur .lbl,.bar.sel .lbl{color:var(--text)}
.bar .val{position:absolute;font-size:11px;color:var(--text);white-space:nowrap;right:0}
.bars-foot{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:12px;gap:8px;flex-wrap:wrap}
.insights{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.ins{background:var(--panel-2);border-radius:11px;padding:12px 13px;font-size:13px;color:var(--text-2);display:flex;gap:10px;align-items:flex-start}
.ins b{color:var(--text)}
.ins .ic{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;background:var(--accent-deep);color:var(--accent-2);flex:none;font-size:14px}
.ins.warn .ic{background:var(--danger-bg);color:var(--danger)}
.ins.ok .ic{color:var(--good)}
.budgets{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:18px 20px}
.bd{display:flex;flex-direction:column;gap:7px;min-width:0}
.bd-top{display:flex;justify-content:space-between;align-items:center;gap:6px}
.bd-top span{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bd-top input{width:104px;background:var(--panel-2);border:1px solid var(--line);border-radius:7px;padding:5px 7px;text-align:right;font-size:12.5px;outline:0;flex:none}
.bd-top input:focus{border-color:var(--accent)}
.track{height:5px;border-radius:5px;background:var(--line);overflow:hidden}
.track i{display:block;height:100%;background:var(--accent);border-radius:5px}
.bd.none .track i{background:var(--bar-none)}
.bd.over .track i{background:var(--danger)}
.bd-foot{font-size:11.5px;color:var(--faint)}
.bd.over .bd-foot{color:var(--danger)}
.list-card{display:flex;flex-direction:column;max-height:calc(100vh - 40px);position:sticky;top:calc(var(--st) + 12px)}
.list-tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.filter{display:flex;gap:3px;background:var(--panel-2);border-radius:8px;padding:3px;flex-wrap:wrap}
.filter button{border:0;background:transparent;border-radius:6px;padding:4px 9px;font-size:12.5px;color:var(--muted)}
.filter button[aria-pressed="true"]{background:var(--line);color:var(--text)}
.list{list-style:none;margin:0;padding:0;overflow-y:auto;display:flex;flex-direction:column;min-height:0}
.mv{display:grid;grid-template-columns:8px minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--row)}
.mv:first-child{border-top:0}
.mv .dot{width:8px;height:8px;border-radius:50%;background:var(--accent)}
.mv .t{font-weight:600;font-size:13.5px;display:flex;align-items:center;gap:6px;min-width:0}
.mv .t span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag{font-size:10.5px;font-weight:600;color:var(--accent-soft);background:var(--accent-deep);border:1px solid var(--accent-line);border-radius:99px;padding:0 6px;line-height:16px;flex:none}
.mv .s{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mv .amt{font-weight:600;font-size:13.5px;white-space:nowrap;text-align:right}
.mv.in .amt{color:var(--good)}
.mv.tr .amt{color:var(--text-2)}
.mv .acts{display:flex;gap:2px}
.mv .acts button{border:0;background:transparent;color:var(--faint);width:30px;height:30px;border-radius:8px;display:grid;place-items:center}
.mv .acts button.confirm{color:var(--danger);width:auto;padding:0 8px;font-size:12px;background:var(--danger-bg)}

/* cuentas */
.stack{display:flex;flex-direction:column;gap:14px}
.acc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.acc{background:var(--panel);border-radius:var(--r);padding:16px 18px;display:flex;flex-direction:column;gap:10px;border-left:4px solid var(--accent)}
.acc .nm{font-weight:600;font-size:15px}
.acc .bal{font-family:var(--display);font-weight:800;font-size:26px;letter-spacing:-.02em}
.acc .row-btns .btn{padding:6px 10px;font-size:12.5px}
.big{font-family:var(--display);font-weight:800;font-size:clamp(28px,4vw,40px);letter-spacing:-.03em;line-height:1.05}
.tbl-wrap{overflow-x:auto;margin:0 -4px}
table.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;text-align:right;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:8px;border-bottom:1px solid var(--row);text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl tr.best td{background:var(--accent-deep)}
.tbl tr.clk{cursor:pointer}
.tbl tr.clk:hover td{background:var(--panel-2)}
.tbl td .sw-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:8px}

/* stats & metas */
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px}
.facts{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.fact{background:var(--panel-2);border-radius:10px;padding:10px 12px}
.fact .k{font-size:11.5px;color:var(--muted)}
.fact .v{font-weight:600;font-size:15px;margin-top:2px}
.line-chart{position:relative;height:190px}
.line-chart svg{width:100%;height:100%;display:block;overflow:visible}
.lc-labels{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);margin-top:6px}
.goal{background:var(--panel);border-radius:var(--r);padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.goal .nm{font-weight:600;font-size:15px}
.goal .pct{font-family:var(--display);font-weight:800;font-size:22px}
.answer{font-size:15px;color:var(--text-2)} .answer b{color:var(--text)}

/* más */
.set-sec{display:flex;flex-direction:column;gap:10px}
.set-sec h3{margin:0;font-size:15px}
.set-sec p{margin:0;color:var(--muted);font-size:12.5px}
.swatches{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.sw{border:1px solid var(--line);background:var(--panel-2);border-radius:10px;padding:8px;display:flex;flex-direction:column;align-items:flex-start;gap:6px;font-size:12px;color:var(--text-2);text-align:left}
.sw .pv{width:100%;height:30px;border-radius:7px;display:flex;align-items:flex-end;gap:3px;padding:5px}
.sw .pv i{flex:1;border-radius:2px}
.sw[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.ilist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.ilist li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;padding:9px 0;border-top:1px solid var(--row)}
.ilist li:first-child{border-top:0}
.ilist .t{font-weight:600;font-size:13.5px;display:flex;align-items:center;gap:8px}
.ilist .s{font-size:11.5px;color:var(--muted)}
.ilist .acts{display:flex;gap:6px;align-items:center}
.ilist input.inp{width:112px;min-height:34px;padding:6px 8px;text-align:right}
.link{border:0;background:transparent;color:var(--accent-2);font-size:12.5px;padding:4px}
.link.bad{color:var(--danger)}
.cdot{width:12px;height:12px;border-radius:50%;flex:none;border:0;padding:0}
input[type=color]{width:34px;height:30px;border:1px solid var(--line);border-radius:7px;background:var(--panel-2);padding:2px}
.mas-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:14px;align-items:start}

/* modal & sheet */
.ov{position:fixed;inset:0;background:rgba(5,4,4,.72);display:grid;place-items:center;z-index:60;padding:calc(var(--st) + 16px) 16px calc(var(--sb) + 16px)}
.ov-card{background:var(--panel);border:1px solid var(--line);border-radius:16px;width:min(560px,100%);max-height:100%;display:flex;flex-direction:column;padding:18px;gap:12px;overflow:auto}
.ov-card.wide{width:min(720px,100%)}
.x{border:0;background:transparent;color:var(--muted);font-size:24px;line-height:1;width:34px;height:34px;border-radius:8px;flex:none}
.imp-list{list-style:none;margin:0;padding:0;overflow-y:auto;min-height:0;display:flex;flex-direction:column;max-height:50vh}
.imp-row{display:grid;grid-template-columns:20px minmax(0,1fr) auto;gap:4px 10px;align-items:center;padding:9px 0;border-top:1px solid var(--row)}
.imp-row:first-child{border-top:0}
.imp-row input[type=checkbox]{accent-color:var(--accent);width:18px;height:18px}
.imp-row .t{font-weight:600;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.imp-row .s{font-size:11.5px;color:var(--muted)}
.imp-row .amt{font-weight:600;white-space:nowrap;text-align:right}
.imp-row .amt.in{color:var(--good)}
.imp-row select{grid-column:2 / -1;background:var(--panel-2);border:1px solid var(--line);border-radius:7px;padding:6px 8px;font-size:13px;max-width:240px}
.imp-row.dup{opacity:.45}
.m-actions{display:flex;justify-content:flex-end;gap:10px;align-items:center;padding-top:8px;border-top:1px solid var(--line);flex-wrap:wrap}
.m-actions .btn-primary{padding:10px 18px}

.form-sheet{display:flex;flex-direction:column;gap:13px}
.fab,.scrim,.tabbar{display:none}
.toast{position:fixed;left:50%;transform:translateX(-50%) translateY(20px);bottom:calc(var(--sb) + 30px);background:var(--toast);border:1px solid var(--line);color:#F3EFEB;padding:10px 16px;border-radius:12px;font-size:13.5px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:90;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* lock */
.lock{position:fixed;inset:0;background:var(--bg);z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:calc(var(--st) + 20px) 20px calc(var(--sb) + 20px)}
.lock h3{margin:0;font-family:var(--display);font-size:22px}
.dots{display:flex;gap:14px}
.dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--accent)}
.dots i.on{background:var(--accent)}
.dots.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.keypad{display:grid;grid-template-columns:repeat(3,72px);gap:14px}
.keypad button{height:72px;border-radius:50%;border:0;background:var(--panel-2);font-size:26px;font-family:var(--display);font-weight:600}
.keypad button:active{background:var(--line)}
.keypad .blank{background:transparent}

@media (max-width:1100px){
  .res-grid{grid-template-columns:minmax(0,1fr)}
  .list-card{position:static;max-height:none}
}
@media (max-width:860px){
  body{font-size:15px;padding-bottom:calc(var(--sb) + var(--tabh) + 90px)}
  .tabs,.btn-add{display:none}
  .row2{grid-template-columns:minmax(0,1fr)}
  .kpis{grid-template-columns:1fr 1fr}
  .kpi.hl,.kpi.neg{grid-column:1 / -1}
  .donut-wrap{justify-content:center}
  .field input,.field select,.bd-top input,.inp,.sel,select,.imp-row select{font-size:16px!important}
  .tabbar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:42;background:color-mix(in srgb,var(--panel) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 6px calc(var(--sb) + 6px)}
  .tabbar button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;color:var(--muted);padding:4px 0}
  .tabbar button svg{width:23px;height:23px}
  .tabbar button[aria-selected="true"]{color:var(--accent-2)}
  .fab{display:grid;place-items:center;position:fixed;right:max(18px,env(safe-area-inset-right,0px));bottom:calc(var(--sb) + var(--tabh) + 18px);width:58px;height:58px;border-radius:50%;border:0;background:var(--accent);color:var(--on-accent);font-size:32px;font-weight:500;z-index:41;box-shadow:0 8px 24px rgba(0,0,0,.35)}
  .toast{bottom:calc(var(--sb) + var(--tabh) + 90px)}
  .ov.sheet{place-items:end stretch;padding:calc(var(--st) + 30px) 0 0}
  .ov.sheet .ov-card{width:100%;border-radius:20px 20px 0 0;border-bottom:0;padding-bottom:calc(var(--sb) + 18px)}
  .swatches{grid-template-columns:repeat(2,minmax(0,1fr))}
  .mas-grid{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:400px){ .kpis{grid-template-columns:1fr} .kpi .v{font-size:26px} .fgrid{grid-template-columns:1fr} .keypad{grid-template-columns:repeat(3,64px)} .keypad button{height:64px} }
@media (prefers-reduced-motion:reduce){ *{transition:none!important;animation:none!important} }

/* ===== marca, íconos de categoría y nuevos componentes ===== */
.brand{display:flex;align-items:center;gap:9px}
.brand img{border-radius:8px;display:block}
.cic{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;font-size:17px;line-height:1;flex:none;border:0;padding:0;
  background:color-mix(in srgb,var(--c,var(--accent)) 18%,transparent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--c,var(--accent)) 30%,transparent)}
.cic.sm{width:26px;height:26px;border-radius:8px;font-size:13px}
.mv.wi{grid-template-columns:34px minmax(0,1fr) auto auto}
.chip span[aria-hidden]{font-size:14px}
button.lg{border:0;background:transparent;padding:2px 0;text-align:left;cursor:pointer;border-radius:6px}
button.lg:hover span{color:var(--text)}
.donut.pie svg{transform:none}
.hbars{display:flex;flex-direction:column;gap:12px}
.hb{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 10px;border:0;background:transparent;padding:0;text-align:left;cursor:pointer}
.hb-l{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:500;min-width:0}
.hb-v{font-size:13px;font-weight:600}.hb-v em{font-style:normal;color:var(--muted);font-weight:500;margin-left:4px}
.hb-t{grid-column:1/-1;height:10px;border-radius:10px;background:var(--panel-2);overflow:hidden}
.hb-t i{display:block;height:100%;border-radius:10px}
.tiles{display:flex;flex-direction:column;gap:8px}
.tile{display:grid;grid-template-columns:40px minmax(0,1fr) auto auto;gap:12px;align-items:center;border:0;cursor:pointer;text-align:left;
  background:var(--panel-2);border-radius:14px;padding:9px 14px 9px 9px;position:relative;overflow:hidden}
.tile .cic{width:40px;height:40px;border-radius:12px;font-size:19px;background:var(--c,var(--accent));box-shadow:none}
.tile{background:color-mix(in srgb,var(--c,var(--accent)) 9%,var(--panel-2))}
.tile .tl-n{font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile .tl-p{font-size:12.5px;color:var(--muted)}
.tile .tl-v{font-weight:700;font-size:14px}
.modes{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.mode{border:1px solid var(--line);background:var(--panel-2);border-radius:12px;padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12.5px;color:var(--text-2)}
.mode svg{width:40px;height:40px}
.mode[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent);color:var(--text)}
.chip .ord{display:inline-grid;place-items:center;width:17px;height:17px;border-radius:50%;background:var(--on-accent);color:var(--accent);font-size:10.5px}
.sw .new{font-size:9.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);margin-left:2px}
.icon-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:8px}
.icon-grid .cic{width:46px;height:46px;font-size:22px;cursor:pointer}
.per-nav{justify-content:center}
.per-nav .month-label{min-width:180px}
.lc-labels span.cur{color:var(--text);font-weight:600}
.row2.one{grid-template-columns:minmax(0,1fr)}
.kpis{grid-template-columns:repeat(var(--kc,3),minmax(0,1fr))}
.bd .track i{background:var(--c,var(--accent))}

/* ===== estilo Vivo ===== */
[data-style="vivid"]{--r:20px}
[data-style="vivid"] .card,[data-style="vivid"] .kpi,[data-style="vivid"] .acc,[data-style="vivid"] .goal,[data-style="vivid"] .fact{box-shadow:var(--shadow)}
[data-style="vivid"] .fact{background:var(--panel)}
[data-style="vivid"] .brand span{background:linear-gradient(90deg,#F2385A,#FFB020 55%,#20B8D8);-webkit-background-clip:text;background-clip:text;color:transparent}
[data-style="vivid"] .kpi.hl{background:var(--hero);border:0;color:#fff;position:relative;overflow:hidden}
[data-style="vivid"] .kpi.hl::after{content:"";position:absolute;right:-40px;top:-50px;width:170px;height:170px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.22),transparent 65%);pointer-events:none}
[data-style="vivid"] .kpi.hl .eyebrow,[data-style="vivid"] .kpi.hl .sub{color:rgba(255,255,255,.82)}
[data-style="vivid"] .kpi.hl .v{color:#fff;font-size:clamp(28px,3.4vw,40px)}
[data-style="vivid"] .kpi.neg{background:linear-gradient(135deg,#F04438,#FF6B4A);border:0}
[data-style="vivid"] .kpi.neg .eyebrow,[data-style="vivid"] .kpi.neg .sub,[data-style="vivid"] .kpi.neg .v{color:#fff}
[data-style="vivid"] .kpi-in .v{color:var(--good)}
[data-style="vivid"] .kpi-out .v{color:var(--spend)}
[data-style="vivid"] .kpi-save .v{color:var(--save)}
[data-style="vivid"] .kpi-in{border-top:4px solid var(--good)} [data-style="vivid"] .kpi-out{border-top:4px solid var(--spend)} [data-style="vivid"] .kpi-save{border-top:4px solid var(--save)} [data-style="vivid"] .kpi-bal{border-top:4px solid var(--accent)}
[data-style="vivid"] .kpi-hero{grid-column:1 / -1;order:-1}
[data-style="vivid"] .bar .b.out{background:var(--bar)}
[data-style="vivid"] .bar.cur .b.out,[data-style="vivid"] .bar.sel .b.out{background:linear-gradient(180deg,#8B5CF6,#4F46E5)}
[data-style="vivid"] .bar .b{border-radius:8px 8px 4px 4px}
[data-style="vivid"] .fab{background:var(--fab);color:#fff;box-shadow:0 10px 26px rgba(255,107,74,.45)}
[data-style="vivid"] .btn-add{background:var(--fab);color:#fff}
[data-style="vivid"] .btn-primary{background:var(--accent);color:#fff;border-color:var(--accent)}
[data-style="vivid"] .btn-primary:hover{filter:brightness(1.08)}
[data-style="vivid"] .chip[aria-pressed="true"]{background:var(--c,var(--accent));color:#fff}
[data-style="vivid"] .chip[aria-pressed="true"] span[aria-hidden]{filter:none}
[data-style="vivid"] .seg button[aria-pressed="true"]{background:var(--accent);color:#fff;border-color:var(--accent)}
[data-style="vivid"] .filter button[aria-pressed="true"]{background:var(--panel);color:var(--accent-2);box-shadow:0 1px 3px rgba(20,26,51,.12)}
[data-style="vivid"] .ins{background:color-mix(in srgb,var(--accent) 7%,var(--panel))}
[data-style="vivid"] .ins .ic{background:var(--accent);color:#fff}
[data-style="vivid"] .ins.warn{background:color-mix(in srgb,#FF6B4A 9%,var(--panel))}
[data-style="vivid"] .ins.warn .ic{background:#FF6B4A;color:#fff}
[data-style="vivid"] .ins.ok{background:color-mix(in srgb,#12B76A 9%,var(--panel))}
[data-style="vivid"] .ins.ok .ic{background:#12B76A;color:#fff}
[data-style="vivid"] .track{height:8px;border-radius:8px}
[data-style="vivid"] .acc{border-left-width:0;border-top:5px solid var(--accent)}
[data-style="vivid"] .tabbar button[aria-selected="true"]{color:var(--accent)}
[data-style="vivid"] .tbl tr.best td{background:color-mix(in srgb,#F5A524 16%,transparent)}
[data-style="vivid"] .mv .amt{font-weight:700}

/* ===== escanear factura ===== */
.scan-cta{width:100%;padding:11px;font-weight:600;border-style:dashed;border-color:var(--accent-line);color:var(--accent-2);background:var(--accent-deep)}
.scan-sum{display:grid;grid-template-columns:64px minmax(0,1fr);gap:12px;align-items:start;background:var(--accent-deep);border:1px solid var(--accent-line);border-radius:12px;padding:10px}
.scan-sum img{width:64px;height:84px;object-fit:cover;border-radius:8px;background:var(--panel-2)}
.scan-sum b{font-size:13.5px}
.scan-box{display:flex;flex-direction:column;gap:12px;align-items:stretch}
.scan-thumb{position:relative;align-self:center;width:180px;height:240px;border-radius:14px;overflow:hidden;background:var(--panel-2);box-shadow:var(--shadow)}
.scan-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.scan-line{position:absolute;left:0;right:0;height:3px;background:linear-gradient(90deg,transparent,var(--accent),transparent);box-shadow:0 0 12px var(--accent);animation:scanmove 1.6s ease-in-out infinite alternate}
@keyframes scanmove{from{top:6%}to{top:92%}}
.top-acts{align-items:center}
@media (max-width:860px){
  .top-acts{display:none}
  .fab-scan{bottom:calc(var(--sb) + var(--tabh) + 86px)!important;width:48px!important;height:48px!important;font-size:20px!important;background:var(--panel)!important;color:var(--text)!important;border:1px solid var(--line)!important;box-shadow:0 6px 18px rgba(0,0,0,.18)!important;right:max(23px,env(safe-area-inset-right,0px))!important}
}
.tips{display:flex;flex-direction:column;gap:12px}
.tip{display:grid;grid-template-columns:48px minmax(0,1fr);gap:12px;align-items:start;background:var(--panel-2);border:1px solid var(--line);border-radius:14px;padding:12px}
.tip.best{background:var(--accent-deep);border-color:var(--accent-line)}
.tip-ic svg{width:48px;height:48px;display:block}
.tip b{font-size:14.5px;display:block}
.tip p{margin:4px 0 0;font-size:12.5px;color:var(--text-2)}
.tip .tag{display:inline-block;margin-top:6px}
.tip-list{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--text-2)}
.tip-hide{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted)}
.tip-hide input{accent-color:var(--accent);width:17px;height:17px}
@media (max-width:860px){ .kpi:not(.kpi-hero) .v{font-size:clamp(19px,5.6vw,26px)} [data-style="vivid"] .kpi.hl .v{font-size:34px} }

/* ===== Guaca te saluda: personaje, bienvenida y celebraciones ===== */
html.hola-open body{overflow:hidden}
.masc{display:block;overflow:visible}
.masc .m-coin,.masc .m-feath,.masc .m-f,.masc .m-face,.masc .m-eyes{transform-box:view-box;transform-origin:0 0}
.masc .m-eyes{transform-origin:0 -9px}
.masc .m-bg{transform-box:view-box;transform-origin:14px 19px;opacity:0;transform:scale(.55);transition:opacity .45s ease,transform .6s cubic-bezier(.2,.9,.3,1.1)}
.masc .m-ring{opacity:0;transition:opacity .4s ease .15s}
.masc .m-coin{transform:scale(1.55);transition:transform .6s cubic-bezier(.3,1.3,.5,1)}
.masc .m-face{transition:opacity .25s ease,transform .3s ease}
.masc .m-feath{transition:transform .9s cubic-bezier(.5,0,.2,1)}
.masc.char{animation:m-bob 1.5s ease-in-out infinite}
.masc.wave .m-f1{animation:m-f1 .9s ease-in-out infinite alternate}
.masc.wave .m-f2{animation:m-f2 .9s ease-in-out .15s infinite alternate}
.masc.wave .m-f3{animation:m-f3 .9s ease-in-out .3s infinite alternate}
.masc.wave .m-feath{animation:m-sway 2.4s ease-in-out infinite alternate}
.masc.jump{animation:m-jump .8s cubic-bezier(.3,0,.3,1) infinite}
.masc.jump .m-f{animation:m-flap .28s ease-in-out infinite alternate}
.masc.jump .m-f2{animation-delay:.09s}.masc.jump .m-f3{animation-delay:.18s}
.masc.blink .m-eyes{animation:m-blink .35s ease 1}
.masc.logo{animation:none}
.masc.logo .m-f,.masc.logo .m-feath{animation:none}
.masc.logo .m-feath{transform:rotate(360deg)}
.masc.logo .m-coin{transform:scale(1)}
.masc.logo .m-face{opacity:0;transform:scale(.6)}
.masc.logo .m-ring{opacity:1}
.masc.logo .m-bg{opacity:1;transform:scale(1)}
.masc.fly{transition:transform .6s cubic-bezier(.6,0,.2,1)}
@keyframes m-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes m-jump{0%,100%{transform:translateY(0) scale(1,1)}15%{transform:translateY(0) scale(1.06,.94)}45%{transform:translateY(-26px) scale(.97,1.04)}75%{transform:translateY(0) scale(1.04,.96)}}
@keyframes m-f1{from{transform:rotate(-7deg)}to{transform:rotate(9deg)}}
@keyframes m-f2{from{transform:rotate(6deg)}to{transform:rotate(-8deg)}}
@keyframes m-f3{from{transform:rotate(-6deg)}to{transform:rotate(8deg)}}
@keyframes m-flap{from{transform:rotate(-12deg)}to{transform:rotate(12deg)}}
@keyframes m-sway{from{transform:rotate(-6deg)}to{transform:rotate(6deg)}}
@keyframes m-blink{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.1)}}

.hola{position:fixed;inset:0;z-index:300;background:var(--bg);display:grid;place-items:center;overflow:hidden;text-align:center;
  padding:calc(var(--st) + 20px) 22px calc(var(--sb) + 20px);transition:background-color .5s ease;cursor:pointer}
.hola-in{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:6px;max-width:520px;width:100%}
.hola-m{width:min(190px,48vw);margin-bottom:14px;transform:scale(0)}
.hola.go .hola-m{animation:m-pop .75s cubic-bezier(.2,1.5,.4,1) forwards}
.hola-t{font-family:var(--display);font-weight:800;font-size:clamp(32px,9vw,52px);line-height:1.04;letter-spacing:-.03em;margin:0;color:var(--text);text-wrap:balance}
.hola-t .w{display:inline-block;opacity:0;transform:translateY(22px) rotate(5deg)}
.go .hola-t .w{animation:w-in .6s cubic-bezier(.2,.9,.3,1.25) forwards;animation-delay:var(--d)}
.hola-t .nm{background:linear-gradient(90deg,#F2385A,#FFB020,#20B8D8,#7C3AED,#F2385A);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:nm-shine 3s linear infinite}
.hola-s{margin:10px 0 0;font-size:clamp(16px,4.4vw,19px);line-height:1.45;color:var(--text-2);max-width:30ch;opacity:0;transform:translateY(10px)}
.go .hola-s,.go .hola-f,.go .cele-b{animation:f-up .6s ease forwards;animation-delay:var(--d)}
.hola-tap{position:fixed;left:0;right:0;bottom:calc(var(--sb) + 26px);margin:0;font-size:13px;color:var(--faint);opacity:0}
.go .hola-tap{animation:f-in .6s ease 1.6s forwards}
.hola-f{display:flex;flex-direction:column;gap:10px;width:min(340px,100%);margin-top:18px;opacity:0;transform:translateY(10px);cursor:auto}
.hola-f input{border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:14px 16px;font-size:18px;text-align:center;outline:none}
.hola-f input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-deep)}
.hola-f .btn-primary{padding:14px;font-size:16px}
.hola-blob{position:absolute;border-radius:50%;filter:blur(70px);opacity:.28;pointer-events:none;animation:blob 7s ease-in-out infinite alternate}
.hola-blob.b1{width:340px;height:340px;background:#F2385A;left:-120px;top:8%}
.hola-blob.b2{width:300px;height:300px;background:#FFC53D;right:-110px;top:40%;animation-delay:-2s}
.hola-blob.b3{width:320px;height:320px;background:#20B8D8;left:10%;bottom:-150px;animation-delay:-4s}
.hola.out{background-color:transparent;pointer-events:none}
.hola.out .hola-t,.hola.out .hola-s,.hola.out .hola-tap,.hola.out .hola-blob,.hola.out .hola-f{opacity:0!important;transition:opacity .3s ease;animation:none}
.hola.out:not(:has(.fly)) .hola-m{opacity:0;transition:opacity .4s ease}
@keyframes m-pop{0%{transform:scale(0) rotate(-25deg)}100%{transform:scale(1) rotate(0)}}
@keyframes w-in{to{opacity:1;transform:none}}
@keyframes f-up{to{opacity:1;transform:none}}
@keyframes f-in{to{opacity:1}}
@keyframes nm-shine{to{background-position:300% 0}}
@keyframes blob{from{transform:translate(0,0) scale(1)}to{transform:translate(30px,-24px) scale(1.12)}}

.cele{position:fixed;inset:0;z-index:250;display:grid;place-items:center;padding:20px;background:rgba(8,10,24,.55);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);opacity:0;transition:opacity .3s ease}
.cele.go{opacity:1}.cele.out{opacity:0}
.cele-card{position:relative;z-index:2;width:min(400px,100%);background:var(--panel);border-radius:28px;padding:26px 22px 20px;text-align:center;box-shadow:0 30px 80px -20px rgba(0,0,0,.5);transform:translateY(30px) scale(.9);transition:transform .5s cubic-bezier(.2,1.4,.4,1)}
.cele.go .cele-card{transform:none}
.cele-m{position:relative;width:132px;margin:-4px auto 10px}
.cele-k{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--accent-2);margin-bottom:6px}
.cele .hola-t{font-size:clamp(28px,7.5vw,36px)}
.cele .hola-s{font-size:16px;margin:10px auto 0}
.cele-b{display:flex;flex-direction:column;gap:8px;margin-top:18px;opacity:0;transform:translateY(10px)}
.cele-b .btn-primary{padding:13px;font-size:16px}
.fx{position:fixed;inset:0;pointer-events:none;z-index:1;overflow:hidden}
.fx .conf,.fx .coin{position:absolute;top:-24px;animation-name:fall;animation-timing-function:cubic-bezier(.3,.1,.6,1);animation-fill-mode:forwards}
.fx .conf{width:9px;height:18px;background:var(--c);border-radius:0 80% 0 80%}
.fx .coin{width:16px;height:16px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#FFE59A,#FFC23D 55%,#F59E0B);box-shadow:inset 0 0 0 2px rgba(180,83,9,.35)}
@keyframes fall{to{transform:translate(var(--dx),115vh) rotate(var(--r))}}
.fx-s{position:absolute;left:50%;top:50%;width:0;height:0;pointer-events:none}
.fx-s .spark{position:absolute;width:9px;height:9px;margin:-4.5px;border-radius:50%;background:var(--c);opacity:0;animation:burst .9s ease-out forwards}
@keyframes burst{0%{transform:translate(0,0) scale(.3);opacity:1}100%{transform:translate(var(--x),var(--y)) scale(1);opacity:0}}
.chk{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--text-2);cursor:pointer}
.chk input{width:20px;height:20px;accent-color:var(--accent);margin:0}
@media (prefers-reduced-motion:reduce){
  .masc,.masc *{animation:none!important;transition:none!important}
  .hola-m{transform:none}.hola-t .w,.hola-s,.hola-f,.cele-b,.hola-tap{opacity:1;transform:none;animation:none!important}
}
</style>

function monthTotals(mk, acc="all"){
  let inc=0,out=0,fixed=0; const byCat={};
  for(const m of allMovs()){
    if(monthKey(m.fecha)!==mk || m.tipo==="transfer") continue;
    if(acc!=="all" && m.cuenta!==acc) continue;
    const v=inMain(m);
    if(m.tipo==="ingreso") inc+=v; else { out+=v; byCat[m.cat]=(byCat[m.cat]||0)+v; if(m.rec) fixed+=v; }
  }
  return {inc,out,byCat,fixed};
}
function balanceOf(accId, upTo){
  const a = accById(accId); let b = a.saldoInicial||0;
  for(const m of allMovs()){
    if(upTo && m.fecha>upTo) continue;
    if(m.tipo==="transfer"){ if(m.cuenta===accId) b-=m.monto; if(m.cuentaDestino===accId) b+=(m.montoDestino??m.monto); }
    else if(m.cuenta===accId) b += m.tipo==="ingreso" ? m.monto : -m.monto;
  }
  return b;
}

function avgNet(n=6){

  if(!months.length){ const t=monthTotals(curMonth); return {avg:t.inc-t.out, n:0}; }

}

const DEF_ICONS = {"Supermercado":"🛒","Comidas afuera":"🍔","Transporte":"🚌","Arriendo y servicios":"🏠","Salud":"💊","Suscripciones":"📺","Ropa":"👕","Tecnología":"💻","Ocio":"🎉","Ahorro":"🐷","Otros":"📦","Salario":"💼","Freelance":"💻","Otros ingresos":"✨","Transferencia":"⇄"};
const ICON_CHOICES = ["🛒","🍔","☕","🍺","🚌","🚗","⛽","✈️","🏠","💡","💧","📱","🌐","💊","🏥","🏋️","📺","🎮","🎬","🎉","👕","👟","💄","🎁","🐶","👶","📚","🎓","🐷","💰","💳","🏦","📈","🧾","🛠️","📦","💼","💻","✨","❤️"];
function catIcon(name, tipo){ const c=(DB.cats[tipo==="ingreso"?"ingreso":"gasto"]||[]).find(x=>x.n===name); return (c&&c.i) || DEF_ICONS[name] || (tipo==="ingreso"?"💰":"🏷️"); }
const V = () => DB.settings.viz;
const NFK = {};
function fmtK(n){ if(!V().compact || Math.abs(n)<10000) return fmt(n); const c=curInfo(main()); const k=c.code; if(!NFK[k]) NFK[k]=new Intl.NumberFormat(c.loc,{style:"currency",currency:k,currencyDisplay:"narrowSymbol",notation:"compact",maximumFractionDigits:1}); return NFK[k].format(Math.abs(n)); }
const fmtKS = n => (n<0?"−":"")+fmtK(n);
const isoOf = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const dateOf = s => new Date(Number(s.slice(0,4)), Number(s.slice(5,7))-1, Number(s.slice(8,10)));
const addDays = (s,n) => { const d=dateOf(s); d.setDate(d.getDate()+n); return isoOf(d); };
function periodRange(per, a){
  if(per==="dia"){ const p={d:Number(a.slice(8)), m:MES_L[Number(a.slice(5,7))-1], w:DOW[dateOf(a).getDay()]}; return {start:a, end:a, label: a===todayISO ? tx("Hoy, {d} de {m}",p) : tx("{w} {d} de {m}",p)}; }
  if(per==="semana"){ const d=dateOf(a); const s=addDays(a,-((d.getDay()+6)%7)), e=addDays(s,6); return {start:s, end:e, label:`${dLabel(s)} – ${dLabel(e)}`}; }
  if(per==="anio"){ const y=a.slice(0,4); return {start:`${y}-01-01`, end:`${y}-12-31`, label:y}; }
  const mk=monthKey(a), [y,m]=mk.split("-").map(Number); return {start:`${mk}-01`, end:`${mk}-${pad(lastDay(y,m))}`, label:mLong(mk)};
}
function shiftPeriod(per, a, k){
  if(per==="dia") return addDays(a,k);
  if(per==="semana") return addDays(a,7*k);
  if(per==="anio") return `${Number(a.slice(0,4))+k}-${a.slice(5)}`;
  return shiftMonth(monthKey(a),k)+"-01";
}
function rangeTotals(start, end, acc="all"){
  let inc=0,out=0,fixed=0,n=0; const byCat={}, byCatIn={};
  for(const m of allMovs()){
    if(m.fecha<start || m.fecha>end || m.tipo==="transfer") continue;
    if(acc!=="all" && m.cuenta!==acc) continue;
    const v=inMain(m); n++;
    if(m.tipo==="ingreso"){ inc+=v; byCatIn[m.cat]=(byCatIn[m.cat]||0)+v; } else { out+=v; byCat[m.cat]=(byCat[m.cat]||0)+v; if(m.rec) fixed+=v; }
  }
  return {inc,out,fixed,byCat,byCatIn,n};
}
function trendBuckets(per, a){
  const out=[];
  if(per==="dia"){ for(let i=6;i>=0;i--){ const d=addDays(a,-i); out.push({start:d,end:d,label:`${DOW[dateOf(d).getDay()].slice(0,2)} ${Number(d.slice(8))}`,key:d}); } }
  else if(per==="semana"){ for(let i=7;i>=0;i--){ const r=periodRange("semana",addDays(a,-7*i)); out.push({start:r.start,end:r.end,label:dLabel(r.start),key:r.start}); } }
  else if(per==="anio"){ for(let i=4;i>=0;i--){ const r=periodRange("anio",shiftPeriod("anio",a,-i)); out.push({...r,label:r.label,key:r.start}); } }
  else { for(let i=5;i>=0;i--){ const r=periodRange("mes",shiftPeriod("mes",a,-i)); out.push({start:r.start,end:r.end,label:MES[Number(r.start.slice(5,7))-1],key:r.start}); } }
  return out;
}

function accOptions(sel, exclude){
  return DB.accounts.filter(a=>!a.archivada && a.id!==exclude).map(a=>`<option value="${a.id}" ${a.id===sel?"selected":""}>${esc(a.name)} · ${a.currency}</option>`).join("");
}
function openMovForm(existing, preset={}){
  const m = existing || null;
  const F = { tipo: m ? m.tipo : (preset.tipo||"gasto"), cat: m ? m.cat : null, picked: !!m };
  const defAcc = m ? m.cuenta : (UI.acc!=="all" ? UI.acc : (DB.accounts.find(a=>!a.archivada)||DB.accounts[0]).id);
  const isRec = m && m.rec;
  const SC = preset.scan || null, PF = preset.prefill || {};
  const body = document.createElement("form"); body.className="form-sheet"; body.autocomplete="off";
  body.innerHTML = `
    ${SC?`<div class="scan-sum"><img src="${SC.thumb}" alt=""><div><b>${SC.found?(SC.qr?tx("✓ Total leído del código QR de la factura electrónica."):tx("✓ Revisa el total que leí.")):tx("No pude leer el total; escríbelo abajo.")}</b>
      ${SC.cands.length>1?`<div class="small muted" style="margin-top:4px">${tx("¿Es otro valor? Tócalo:")}</div><div class="chipset" id="f-cands" style="margin-top:4px">${SC.cands.map(v=>`<button type="button" class="chip" data-v="${v}" aria-pressed="${v===PF.monto}">${fmt(v)}</button>`).join("")}</div>`:""}
      <div class="small" style="margin-top:6px;color:var(--accent-2);font-weight:600">${tx("Elige la categoría y toca Agregar.")}</div>${!SC.found?`<button type="button" class="link" id="f-tips" style="padding:6px 0 0">${tx("Ver cómo tomar la foto")}</button>`:""}</div></div>`:(!m?`<button type="button" class="btn scan-cta" id="f-scan">📷 ${tx("Escanear factura")}</button>`:"")}
    <div class="seg" role="group" aria-label="${tx("Tipo")}">
      <button type="button" data-t="gasto">${tx("Gasto")}</button><button type="button" data-t="ingreso">${tx("Ingreso")}</button><button type="button" data-t="transfer">${tx("Transferencia")}</button>
    </div>
    <div class="amount"><span id="f-sym">$</span><input id="f-monto" inputmode="numeric" placeholder="0" aria-label="${tx("Monto")}"></div>
    <div class="fgrid">
      <div class="field"><label for="f-cuenta" id="f-cuenta-l">${tx("Cuenta")}</label><select id="f-cuenta">${accOptions(defAcc)}</select></div>
      <div class="field" id="f-dest-w"><label for="f-dest">${tx("Hacia")}</label><select id="f-dest"></select></div>
    </div>
    <div class="field" id="f-md-w"><label for="f-md" id="f-md-l"></label><input id="f-md" inputmode="decimal"></div>
    <div id="f-cats-w"><div class="flabel" style="margin-bottom:6px">${tx("Categoría")}</div><div class="chipset" id="f-cats"></div></div>
    <div class="fgrid">
      <div class="field"><label for="f-fecha">${tx("Fecha")}</label><input type="date" id="f-fecha"></div>
      <div class="field"><label for="f-nota">${tx("Nota o comercio")}</label><input id="f-nota" maxlength="60" placeholder="${tx("ej. Carulla")}"></div>
    </div>
    <label class="switch-row" for="f-rec"><span class="lbl"><b id="f-rec-l">${tx("Repetir cada mes")}</b><small id="f-rec-h"></small></span><span class="switch"><input type="checkbox" id="f-rec"><i></i></span></label>
    <div class="field" id="f-link-w"><label for="f-link">${tx("Enlace de pago (opcional)")}</label><input id="f-link" inputmode="url" autocapitalize="off" autocorrect="off" placeholder="${tx("ej. enel.com.co/pagos")}"></div>
    <button type="submit" class="btn-primary" id="f-go">${m?tx("Guardar cambios"):tx("Agregar")}</button>
    <div class="msg" id="f-msg"></div>`;
  const md = openModal({title: m ? (isRec?tx("Editar movimiento fijo"):tx("Editar movimiento")) : tx("Nuevo movimiento"), body});
  const q = s => body.querySelector(s);
  const cur = () => accCur(q("#f-cuenta").value);
  const destCur = () => accCur(q("#f-dest").value);
  function paint(){
    body.querySelectorAll(".seg button").forEach(b=>b.setAttribute("aria-pressed", b.dataset.t===F.tipo));
    const tr = F.tipo==="transfer";
    q("#f-cats-w").hidden = tr; q("#f-dest-w").style.display = tr ? "" : "none";
    q("#f-cuenta-l").textContent = tr ? tx("Desde") : tx("Cuenta");
    if(tr){ const keep=q("#f-dest").value || (m&&m.cuentaDestino); q("#f-dest").innerHTML = accOptions(keep, q("#f-cuenta").value) || `<option value="">${tx("Crea otra cuenta primero")}</option>`; }
    q("#f-md-w").hidden = !(tr && q("#f-dest").value && destCur()!==cur());
    q("#f-md-l").textContent = tx("Monto recibido ({c})",{c:destCur()});
    q("#f-sym").textContent = symOf(cur());
    q("#f-monto").setAttribute("inputmode", curInfo(cur()).dec?"decimal":"numeric");
    if(!tr){
      const cats = catList(F.tipo); if(!cats.includes(F.cat)) F.cat = cats.includes(F.cat)?F.cat:null;
      q("#f-cats").innerHTML = cats.map(c=>`<button type="button" class="chip" data-cat="${esc(c)}" aria-pressed="${c===F.cat}" style="--c:${colorOf(c,F.tipo)}">${V().icons?`<span aria-hidden="true">${catIcon(c,F.tipo)}</span>`:`<i style="background:${colorOf(c,F.tipo)}"></i>`}${esc(catName(c))}</button>`).join("");
    }
    q("#f-link-w").hidden = !(q("#f-rec").checked && F.tipo==="gasto");
    const d = Number((q("#f-fecha").value||todayISO).slice(8));
    if(isRec){ q("#f-rec-l").textContent=tx("Aplicar a los próximos meses"); q("#f-rec-h").textContent = q("#f-rec").checked ? tx("Cambia este mes y los siguientes.") : tx("Cambia solo este mes."); }
    else q("#f-rec-h").textContent = q("#f-rec").checked ? tx("Se registrará solo el día {d} de cada mes, desde este mes en adelante.",{d}) : tx("Para arriendo, salario, suscripciones y otros fijos.");
  }
  function suggestDest(){
    if(F.tipo!=="transfer" || q("#f-md-w").hidden) return;
    const v = parseMonto(q("#f-monto").value, cur()); if(!v) return;
    if(!rateOf(cur()) || !rateOf(destCur())) return;
    const c = convert(v, cur(), destCur()); const dc=curInfo(destCur()).dec;
    q("#f-md").value = fmtInput(Math.round(c*10**dc)/10**dc, destCur());
  }
  body.querySelector(".seg").onclick = e => { const b=e.target.closest("button"); if(!b) return; F.tipo=b.dataset.t; if(!F.picked) F.cat=null; paint(); };
  q("#f-cats").onclick = e => { const b=e.target.closest(".chip"); if(!b) return; F.cat=b.dataset.cat; F.picked=true; paint(); };
  q("#f-cuenta").onchange = () => { paint(); suggestDest(); };
  q("#f-dest").onchange = () => { paint(); suggestDest(); };
  q("#f-monto").oninput = e => { liveFormat(e.target, cur()); suggestDest(); };
  q("#f-md").oninput = e => liveFormat(e.target, destCur());
  q("#f-rec").onchange = paint; q("#f-fecha").onchange = paint;
  q("#f-nota").oninput = e => { if(F.picked || F.tipo==="transfer") return; const g=guessCat(e.target.value, F.tipo); if(g && g!==F.cat){ F.cat=g; paint(); } };
  // valores iniciales
  q("#f-fecha").value = m ? m.fecha : todayISO;
  if(m){ q("#f-monto").value = fmtInput(m.monto, accCur(m.cuenta)); q("#f-nota").value = m.nota||""; q("#f-rec").checked = !!m.rec; const rr=m.rec&&DB.recs.find(x=>x.id===m.rec); if(rr) q("#f-link").value=rr.link||""; }
  paint();
  if(m && m.tipo==="transfer"){ q("#f-dest").value = m.cuentaDestino; paint(); if(m.montoDestino!=null) q("#f-md").value = fmtInput(m.montoDestino, destCur()); }
  if(SC || PF.monto!=null){ if(PF.monto) q("#f-monto").value=fmtInput(Math.round(PF.monto*100)/100, cur()); if(PF.fecha) q("#f-fecha").value=PF.fecha; if(PF.nota){ q("#f-nota").value=PF.nota; const g=guessCat(PF.nota,F.tipo); if(g){ F.cat=g; } } paint(); }
  if(q("#f-cands")) q("#f-cands").onclick=e=>{ const b=e.target.closest("[data-v]"); if(!b) return; q("#f-monto").value=fmtInput(Number(b.dataset.v), cur()); q("#f-cands").querySelectorAll(".chip").forEach(x=>x.setAttribute("aria-pressed",x===b)); };
  if(q("#f-scan")) q("#f-scan").onclick=()=>{ md.close(); startScan(); };
  if(q("#f-tips")) q("#f-tips").onclick=()=>{ md.close(); startScan(true); };
  if(!m && !SC) setTimeout(()=>q("#f-monto").focus(), 250);

  body.addEventListener("submit", e => {
    e.preventDefault();
    const msg=q("#f-msg"); msg.className="msg";
    const err = t => { msg.textContent=t; msg.classList.add("err"); };
    const monto = parseMonto(q("#f-monto").value, cur()), fecha=q("#f-fecha").value, nota=q("#f-nota").value.trim(), recur=q("#f-rec").checked;
    if(!monto) return err(tx("Escribe un monto mayor a 0."));
    if(!/^\d{4}-\d{2}-\d{2}$/.test(fecha)) return err(tx("Elige una fecha válida."));
    const base = {tipo:F.tipo, monto, fecha, nota, cuenta:q("#f-cuenta").value};
    if(F.tipo==="transfer"){
      const dest=q("#f-dest").value; if(!dest) return err(tx("Necesitas al menos dos cuentas. Créalas en la pestaña Cuentas."));
      base.cuentaDestino=dest; base.cat="Transferencia";
      if(!q("#f-md-w").hidden && !parseMonto(q("#f-md").value, destCur())) return err(tx("Escribe cuánto llega a la cuenta destino en {c}.",{c:destCur()}));
      base.montoDestino = q("#f-md-w").hidden ? monto : parseMonto(q("#f-md").value, destCur());
    } else base.cat = F.cat || guessCat(nota, F.tipo) || fallbackCat(F.tipo);
    let txt, moved=null;
    if(m){
      const tgt = DB.movs.find(x=>x.id===m.id); if(!tgt) return md.close();
      for(const k of ["cuentaDestino","montoDestino"]) delete tgt[k];
      Object.assign(tgt, base);
      if(tgt.rec){
        const r = DB.recs.find(x=>x.id===tgt.rec);
        if(r && recur){ Object.assign(r, base, {dia:Number(fecha.slice(8))}); delete r.fecha; applyTemplateFrom(r, shiftMonth(monthKey(fecha),1)); txt=tx("Fijo actualizado desde este mes."); }
        else txt=tx("Cambio aplicado solo a este mes.");
      } else if(recur){
        const r = Object.assign({id:uid(), dia:Number(fecha.slice(8)), desde:monthKey(fecha)<curMonth?curMonth:monthKey(fecha), creado:todayISO, skip:[]}, base); delete r.fecha;
        DB.recs.push(r); tgt.rec=r.id; genRecurring(); txt=tx("Ahora se repite cada mes.");
      } else txt=tx("Movimiento actualizado.");
    } else {
      const nm = Object.assign({id:"m"+uid(), creado:Date.now()}, base);
      if(recur){
        const startMk = monthKey(fecha)<curMonth ? curMonth : monthKey(fecha);
        if(startMk!==monthKey(fecha)){ const [yy,mo]=startMk.split("-").map(Number); nm.fecha=`${startMk}-${pad(Math.min(Number(fecha.slice(8)),lastDay(yy,mo)))}`; moved=startMk; }
        const r = Object.assign({id:uid(), dia:Number(fecha.slice(8)), desde:startMk, creado:todayISO, skip:[]}, base); delete r.fecha; DB.recs.push(r); nm.rec=r.id;
      }
      DB.movs.push(nm); if(recur) genRecurring();
      txt = F.tipo==="transfer" ? tx("Transferencia de {m} registrada.",{m:fmtC(monto,cur())}) : tx(recur?"{t} de {m} agregado como fijo mensual.":"{t} de {m} agregado.",{t:F.tipo==="gasto"?tx("Gasto"):tx("Ingreso"),m:fmtC(monto,cur())});
    }
    const link = normLink(q("#f-link").value);
    const recId = m ? (DB.movs.find(x=>x.id===m.id)||{}).rec : (DB.movs[DB.movs.length-1]||{}).rec;
    const rr = recId && DB.recs.find(x=>x.id===recId); if(rr && !q("#f-link-w").hidden) rr.link = link;
    if(!save()) return;
    UI.anchor = moved ? moved+"-01" : fecha; md.close(); renderAll(); toast(moved ? txt+" "+tx("Los fijos empiezan desde el mes actual ({m}).",{m:mLong(moved)}) : txt);
  });
}

function movRow(m, demo){
  const tr=m.tipo==="transfer", c=accCur(m.cuenta);
  const acts=demo?"":`<div class="acts"><button data-act="edit" data-id="${m.id}" aria-label="${tx("Editar")}">✎</button>${UI.confirmId===m.id?`<button class="confirm" data-act="del" data-id="${m.id}">${tx("Borrar")}</button>`:`<button data-act="del" data-id="${m.id}" aria-label="${tx("Eliminar")}">🗑︎</button>`}</div>`;
  const title = tr ? tx("Transferencia") : catName(m.cat);
  const sub = tr ? `${dLabel(m.fecha)} · ${esc(accById(m.cuenta).name)} → ${esc(accById(m.cuentaDestino).name)}` : `${dLabel(m.fecha)}${m.nota?" · "+esc(m.nota):""}${DB.accounts.length>1&&UI.acc==="all"?" · "+esc(accById(m.cuenta).name):""}`;
  const dot = tr ? "var(--muted)" : m.tipo==="ingreso" ? (window.IS_VIVID?colorOf(m.cat,"ingreso"):"var(--good)") : colorOf(m.cat);
  const icon = V().icons ? `<span class="cic" style="--c:${dot}">${tr?"⇄":catIcon(m.cat,m.tipo)}</span>` : `<span class="dot" style="background:${dot}"></span>`;
  const amt = tr ? `⇄ ${fmtC(m.monto,c)}` : `${m.tipo==="ingreso"?"+ ":"− "}${fmtC(m.monto,c)}`;
  return `<li class="mv ${m.tipo==="ingreso"?"in":""} ${tr?"tr":""} ${V().icons?"wi":""}">${icon}
    <div style="min-width:0"><div class="t"><span>${esc(title)}</span>${m.rec?`<span class="tag">↻ ${tx("fijo")}</span>`:""}</div><div class="s">${sub}</div></div>
    <div class="amt num">${amt}${c!==main()&&!tr?`<div class="s">${fmt(inMain(m))}</div>`:""}</div>${acts}</li>`;
}
function listClick(e){
  const b=e.target.closest("button[data-act]"); if(!b) return;
  const id=b.dataset.id, m=DB.movs.find(x=>x.id===id); if(!m) return;
  if(b.dataset.act==="edit") return openMovForm(m);
  if(UI.confirmId===id){
    UI.confirmId=null;
    if(m.rec){ const r=DB.recs.find(x=>x.id===m.rec); if(r){ r.skip=r.skip||[]; r.skip.push(monthKey(m.fecha)); } }
    DB.movs=DB.movs.filter(x=>x.id!==id); save(); renderAll();
    toast(m.rec?tx("Borrado de este mes. El fijo sigue en los próximos."):tx("Movimiento borrado."));
  } else { UI.confirmId=id; renderAll(); setTimeout(()=>{ if(UI.confirmId===id){UI.confirmId=null;renderAll();} },4000); }
}

/* ================= Resumen (períodos y visualización configurable) ================= */
const PER_LBL = {dia:"Día", semana:"Semana", mes:"Mes", anio:"Año"};
const KPI_DEFS = {
  ingresos:"Ingresos", gastos:"Gastos", queda:"Te queda", saldo:"Saldo total", diario:"Gasto diario promedio", ahorro:"Tasa de ahorro", fijos:"Gastos fijos"
};
function insights(mk){
  const out=[]; const r=periodRange("mes",mk+"-01"), t=rangeTotals(r.start,r.end,UI.acc);
  const prevs=[1,2,3].map(i=>{ const q=periodRange("mes",shiftMonth(mk,-i)+"-01"); return rangeTotals(q.start,q.end,UI.acc); }).filter(p=>p.out>0);
  if(prevs.length){
    let best=null;
    for(const [c,v] of Object.entries(t.byCat)){ const avg=sum(prevs.map(p=>p.byCat[c]||0))/prevs.length; if(avg>0 && v>avg*1.25 && (!best || v-avg>best.d)) best={c,d:v-avg,avg}; }
    if(best) out.push({k:"warn",ic:"↑",h:tx("Este mes llevas <b>{d}</b> más de lo usual en <b>{c}</b> (promedio {a}).",{d:fmt(best.d),c:esc(catName(best.c)),a:fmt(best.avg)})});
  }
  const subs=allMovs().filter(m=>monthKey(m.fecha)===mk && m.tipo==="gasto" && m.cat==="Suscripciones" && (UI.acc==="all"||m.cuenta===UI.acc));
  if(subs.length){ const s=sum(subs.map(inMain)); out.push({k:"",ic:"↻",h:tx("Tus suscripciones suman <b>{m}</b> al mes, <b>{y}</b> al año. Revisa si usas todas.",{m:fmt(s),y:fmt(s*12)})}); }
  if(t.inc && t.fixed/t.inc>0.5) out.push({k:"warn",ic:"!",h:tx("Tus gastos fijos son el <b>{p}%</b> de tus ingresos. Lo recomendable es menos del 50%.",{p:Math.round(t.fixed/t.inc*100)})});
  const B=budgets(); const over=Object.keys(B).filter(c=>(t.byCat[c]||0)>B[c]);
  if(over.length) out.push({k:"warn",ic:"!",h:tx("Te pasaste del presupuesto en <b>{c}</b>.",{c:over.map(c=>esc(catName(c))).join(", ")})});
  if(mk===curMonth && t.inc){ const left=t.inc-t.out, days=lastDay(now.getFullYear(),now.getMonth()+1)-now.getDate()+1;
    if(left>0) out.push({k:"ok",ic:"$",h:tn(days,"Te quedan <b>{a}</b> para {n} día: unos <b>{b}</b> por día.","Te quedan <b>{a}</b> para {n} días: unos <b>{b}</b> por día.",{a:fmt(left),b:fmt(left/days)})}); }
  if(t.inc && (t.inc-t.out)/t.inc>=0.2) out.push({k:"ok",ic:"✓",h:tx("Vas ahorrando el <b>{p}%</b> de tus ingresos este mes. ¡Bien!",{p:Math.round((t.inc-t.out)/t.inc*100)})});
  return out.slice(0,4);
}
function daysElapsed(r){ const end = r.end>todayISO ? todayISO : r.end; if(end<r.start) return 1; return Math.round((dateOf(end)-dateOf(r.start))/864e5)+1; }
function kpiCard(k, t, prev, r){

    case "gastos": return `<div class="kpi kpi-out"><div class="eyebrow">${tx("Gastos")}</div><div class="v num">${fmtK(t.out)}</div><div class="sub">${prev.out?`${t.out>=prev.out?"▲":"▼"} ${tx("{p}% vs. período anterior",{p:Math.abs(Math.round((t.out/prev.out-1)*100))})}`:"&nbsp;"}</div></div>`;

    case "diario": { const d=daysElapsed(r); return `<div class="kpi"><div class="eyebrow">${tx("Gasto diario promedio")}</div><div class="v num">${fmtK(t.out/d)}</div><div class="sub">${tn(d,"{n} día del período","{n} días del período")}</div></div>`; }
    case "ahorro": { const p=t.inc?Math.round(left/t.inc*100):0; return `<div class="kpi kpi-save"><div class="eyebrow">${tx("Tasa de ahorro")}</div><div class="v num ${p<0?"bad":""}">${p}%</div><div class="track" style="margin-top:4px"><i style="width:${Math.max(0,Math.min(100,p))}%;background:var(--save)"></i></div></div>`; }
    case "fijos": return `<div class="kpi"><div class="eyebrow">${tx("Gastos fijos")}</div><div class="v num">${fmtK(t.fixed)}</div><div class="sub">${t.out?tx("{p}% de tus gastos",{p:Math.round(t.fixed/t.out*100)}):"&nbsp;"}</div></div>`;

function donutSVG(entries, total, tipo){
  const vivid=window.IS_VIVID, sw=vivid?5.2:4.6, gap=entries.length>1?(vivid?2.2:0.4):0;
  let off=0, s=`<circle cx="21" cy="21" r="15.9155" fill="none" stroke="var(--line)" stroke-width="${sw}"></circle>`;
  for(const [c,v] of entries){ const len=v/total*100, L=Math.max(len-gap,0.1);
    s+=`<circle cx="21" cy="21" r="15.9155" fill="none" stroke="${colorOf(c,tipo)}" stroke-width="${sw}" ${vivid&&entries.length>1?'stroke-linecap="round"':""} stroke-dasharray="${L} ${100-L}" stroke-dashoffset="${-(off+gap/2)}" pathLength="100"><title>${esc(catName(c))}: ${fmt(v)}</title></circle>`; off+=len; }
  return `<svg viewBox="0 0 42 42" aria-hidden="true">${s}</svg>`;
}
function pieSVG(entries, total, tipo){
  if(entries.length===1) return `<svg viewBox="-1 -1 2 2" aria-hidden="true"><circle r="1" fill="${colorOf(entries[0][0],tipo)}"/></svg>`;
  let a=-Math.PI/2, s="";
  for(const [c,v] of entries){ const da=v/total*Math.PI*2, a2=a+da, large=da>Math.PI?1:0;
    s+=`<path d="M0 0 L${Math.cos(a).toFixed(4)} ${Math.sin(a).toFixed(4)} A1 1 0 ${large} 1 ${Math.cos(a2).toFixed(4)} ${Math.sin(a2).toFixed(4)} Z" fill="${colorOf(c,tipo)}" stroke="var(--panel)" stroke-width=".02"><title>${esc(catName(c))}: ${fmt(v)}</title></path>`; a=a2; }
  return `<svg viewBox="-1 -1 2 2" aria-hidden="true" style="transform:none">${s}</svg>`;
}
function catChart(entries, total, tipo){
  const mode=V().cat, icons=V().icons;
  if(!entries.length) return `<div class="empty">${tipo==="ingreso"?tx("Aún no hay ingresos en este período."):tx("Aún no hay gastos en este período.")}</div>`;
  const pct=v=>{const p=v/total*100; return p<1?"<1":Math.round(p);};
  const legend = `<div class="legend">${entries.map(([c,v])=>`<button class="lg" data-catf="${esc(c)}"><i style="background:${colorOf(c,tipo)}"></i><span>${icons?catIcon(c,tipo)+" ":""}${esc(catName(c))}</span><em class="num">${pct(v)}%</em></button>`).join("")}</div>`;
  if(mode==="dona"||mode==="pastel"){
    return `<div class="donut-wrap"><div class="donut ${mode==="pastel"?"pie":""}">${mode==="pastel"?pieSVG(entries,total,tipo):donutSVG(entries,total,tipo)}${mode==="dona"?`<div class="c"><b class="num">${fmtK(total)}</b><small>${tipo==="ingreso"?tx("recibido"):tx("gastado")}</small></div>`:""}</div>${legend}</div>`;

  return `<div class="tiles">${entries.map(([c,v])=>`<button class="tile" data-catf="${esc(c)}" style="--c:${colorOf(c,tipo)}"><span class="cic">${icons?catIcon(c,tipo):""}</span><span class="tl-n">${esc(catName(c))}</span><span class="tl-p num">${pct(v)}%</span><span class="tl-v num">${fmtK(v)}</span></button>`).join("")}</div>`;
}

}

function lineChart(vals){
  const W=600,H=180, min=Math.min(0,...vals), max=Math.max(0,...vals), span=(max-min)||1;
  const X=i=>vals.length<2?0:i/(vals.length-1)*W, Y=v=>H-(v-min)/span*H;
  const pts=vals.map((v,i)=>`${X(i).toFixed(1)},${Y(v).toFixed(1)}`);
  const area=`M0,${Y(Math.max(min,0))} L${pts.join(" L")} L${W},${Y(Math.max(min,0))} Z`;
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true">
    <line x1="0" x2="${W}" y1="${Y(0)}" y2="${Y(0)}" stroke="var(--line)" stroke-width="1" vector-effect="non-scaling-stroke"/>
    <path d="${area}" fill="var(--accent)" opacity=".14"/>
    <polyline points="${pts.join(" ")}" fill="none" stroke="var(--accent)" stroke-width="2.5" vector-effect="non-scaling-stroke" stroke-linejoin="round"/>
  </svg>`;
}

function periodMonths(p){
  if(p==="12m"){ const a=[]; for(let i=11;i>=0;i--) a.push(shiftMonth(curMonth,-i)); return a; }
  if(p==="all"){ const a=[]; let mk=firstMonth(); while(mk<=curMonth){ a.push(mk); mk=shiftMonth(mk,1);} return a; }
  const a=[]; for(let m=1;m<=12;m++){ const mk=`${p}-${pad(m)}`; if(mk<=curMonth) a.push(mk); } return a.length?a:[`${p}-01`];
}
function analyze(months, pred){
  const set=new Set(months); const byM={}; months.forEach(mk=>byM[mk]=0); const byY={}; let n=0;
  for(const m of allMovs()){ if(m.tipo!=="gasto"||!pred(m)) continue; const v=inMain(m), y=m.fecha.slice(0,4);
    byY[y]=(byY[y]||0)+v; if(set.has(monthKey(m.fecha))){ byM[monthKey(m.fecha)]+=v; n++; } }
  const total=sum(Object.values(byM)); const maxM=Object.entries(byM).sort((a,b)=>b[1]-a[1])[0]; const maxY=Object.entries(byY).sort((a,b)=>b[1]-a[1])[0];
  return {total, avg: total/months.length, n, byM, maxM, maxY, byY};
}

/* ================= Importar ================= */
function parseNum(raw){
  let s=String(raw??"").trim(); if(!s) return NaN;
  const neg = /^\(.*\)$/.test(s) || /^-|-\s*$|^[^\d]*-/.test(s);
  s=s.replace(/[^\d.,]/g,""); if(!s) return NaN;
  const last=Math.max(s.lastIndexOf("."),s.lastIndexOf(","));
  let n;
  if(last>=0 && /^\d{1,2}$/.test(s.slice(last+1))) n=Number(s.slice(0,last).replace(/[.,]/g,"")+"."+s.slice(last+1));
  else n=Number(s.replace(/[.,]/g,""));
  return neg?-n:n;
}
function parseDateAny(raw, order="DMY"){
  const t=String(raw||"").trim();
  let m=t.match(/(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})(?:[ T](\d{1,2}):(\d{2}))?/);
  if(m) return {fecha:`${m[1]}-${pad(m[2])}-${pad(m[3])}`, hora:m[4]!==undefined?`${pad(m[4])}:${m[5]}`:""};
  m=t.match(/(\d{1,2})[-/.](\d{1,2})[-/.' ]+(\d{2,4})(?:\D+(\d{1,2}):(\d{2}))?/);
  if(m){ let a=Number(m[1]), b=Number(m[2]); const y=m[3].length===2?"20"+m[3]:m[3];
    let d=a, mo=b; if(order==="MDY"){ d=b; mo=a; } if(mo>12 && d<=12){ const x=d; d=mo; mo=x; }
    if(mo<1||mo>12||d<1||d>31) return null;
    return {fecha:`${y}-${pad(mo)}-${pad(d)}`, hora:m[4]!==undefined?`${pad(m[4])}:${m[5]}`:""}; }
  return null;
}
function guessOrder(dates){ for(const s of dates){ const m=String(s).match(/(\d{1,2})[-/.](\d{1,2})[-/.' ]/); if(m){ if(Number(m[1])>12) return "DMY"; if(Number(m[2])>12) return "MDY"; } } return "DMY"; }
function hash(str){ let h=2166136261>>>0; for(let i=0;i<str.length;i++){ h^=str.charCodeAt(i); h=Math.imul(h,16777619)>>>0; } return h.toString(36); }
function parseQIF(text){
  const recs=[]; let cur={};
  for(const raw of text.split(/\r?\n/)){ const line=raw.trimEnd(); if(!line) continue; const k=line[0], v=line.slice(1).trim();
    if(line.startsWith("!")) continue;
    if(k==="^"){ if(cur.D) recs.push(cur); cur={}; continue; }
    if(k==="D") cur.D=v; else if(k==="T"||k==="U") cur.T=v; else if(k==="P") cur.P=v; else if(k==="M") cur.M=v; else if(k==="L") cur.L=v; }
  if(cur.D) recs.push(cur);
  const order=guessOrder(recs.map(r=>r.D));
  return recs.map(r=>({d:parseDateAny(r.D,order), n:parseNum(r.T), desc:[r.P,r.M].filter(Boolean).join(" · ")||tx("Movimiento"), cat:r.L&&!/^\[/.test(r.L)?r.L.split(":")[0]:null, transfer:/^\[/.test(r.L||"")}));
}
function parseDelimited(text){
  const lines=text.replace(/^﻿/,"").split(/\r?\n/).filter(l=>l.trim());
  if(!lines.length) return [];
  const cands=[";","\t","|",","]; let del=";", best=-1;
  for(const c of cands){ const counts=lines.slice(0,20).map(l=>splitRow(l,c).length); const mode=counts.sort((a,b)=>counts.filter(x=>x===b).length-counts.filter(x=>x===a).length)[0]; const score=mode>1?counts.filter(x=>x===mode).length*mode:0; if(score>best){best=score;del=c;} }
  const rows=lines.map(l=>splitRow(l,del).map(x=>x.trim()));
  const H=rows[0].map(h=>h.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,""));
  const isHeader = H.some(h=>/fecha|date|monto|valor|amount|descrip|concepto|detalle|importe|debito|credito/.test(h)) && !parseDateAny(rows[0].join(" "));
  const find = re => H.findIndex(h=>re.test(h));
  let ci={};
  if(isHeader){
    ci.d=find(/fecha|date|fec/); ci.a=find(/monto|valor|amount|importe|cantidad|total/); ci.deb=find(/debito|debit|cargo|retiro/); ci.cre=find(/credito|credit|abono|deposito/);
    ci.t=find(/descrip|concepto|detalle|comercio|payee|referencia|nombre|memo|nota/); ci.c=find(/categoria|category/);
  }
  const body = isHeader ? rows.slice(1) : rows;
  const ncol = Math.max(...body.map(r=>r.length));
  if(ci.d===undefined || ci.d<0){ for(let j=0;j<ncol;j++){ if(body.filter(r=>parseDateAny(r[j])).length>=body.length*0.6){ ci.d=j; break; } } }
  if((ci.a===undefined||ci.a<0) && !(ci.deb>=0||ci.cre>=0)){ for(let j=0;j<ncol;j++){ if(j===ci.d) continue; if(body.filter(r=>/\d/.test(r[j]||"") && !isNaN(parseNum(r[j])) && !/[a-z]{3,}/i.test(r[j])).length>=body.length*0.6){ ci.a=j; break; } } }
  if(ci.t===undefined || ci.t<0){ let bj=-1,bl=0; for(let j=0;j<ncol;j++){ if(j===ci.d||j===ci.a) continue; const L=sum(body.map(r=>(r[j]||"").replace(/[\d\s.,$-]/g,"").length)); if(L>bl){bl=L;bj=j;} } ci.t=bj; }
  const order=guessOrder(body.map(r=>r[ci.d]));
  return body.map(r=>{ let n;
    if(ci.a>=0) n=parseNum(r[ci.a]); else { const de=parseNum(r[ci.deb]), cr=parseNum(r[ci.cre]); n = (!isNaN(cr)&&cr)?Math.abs(cr):(!isNaN(de)&&de)?-Math.abs(de):NaN; }
    return {d:parseDateAny(r[ci.d],order), n, desc:(ci.t>=0?r[ci.t]:"")||tx("Movimiento"), cat:ci.c>=0?r[ci.c]:null}; });
}
function splitRow(line, del){ const out=[]; let cur="", q=false; for(let i=0;i<line.length;i++){ const ch=line[i]; if(ch==='"'){ if(q&&line[i+1]==='"'){cur+='"';i++;} else q=!q; } else if(ch===del&&!q){out.push(cur);cur="";} else cur+=ch; } out.push(cur); return out; }
function startImport(kind){
  const accept = kind==="qif" ? ".qif,text/plain" : ".csv,.txt,text/plain,text/csv";
  pickFile(accept, (text, name)=>{
    const isQ = kind==="qif" || /\.qif$/i.test(name) || /^!Type/m.test(text);
    let rows = isQ ? parseQIF(text) : parseDelimited(text);
    const bad = rows.filter(r=>!r.d||isNaN(r.n)||!r.n).length;

async function hashPin(pin, salt){

}
